<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MKX — Watch</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    /* ====================================================== */
    /* LUX / NOX (SYNCED FROM HOME localStorage('mode')) */
    /* ====================================================== */
    :root{
      --bg-primary: radial-gradient(circle at top, #121220 0%, #050509 40%, #000000 100%);
      --text-primary:#ffffff;
      --text-secondary:#9aa0aa;
      --accent-green: #9cf35d; /* ADDED: Green accent color */

      --border: rgba(255,255,255,.12);
      --border-strong: rgba(255,255,255,.24);
      --panel: rgba(0,0,0,.40);

      --shadow: rgba(0,0,0,.70);

      --mono:"Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans:"Space Grotesk", system-ui, -apple-system, Segoe UI, sans-serif;
    }
    body.light-mode{
      --bg-primary:
        radial-gradient(circle at 30% 0%,
          rgba(255,255,255,1) 0%,
          rgba(245,248,255,0.95) 35%,
          rgba(230,235,255,0.90) 70%,
          rgba(210,220,245,0.85) 100%
        ),
        linear-gradient(135deg, rgba(255,255,255,0.85), rgba(230,235,250,0.90));
      --text-primary:#000000;
      --text-secondary:#4b5563;
      --accent-green: #7bd142; /* Slightly darker green for light mode */

      --border: rgba(0,0,0,.12);
      --border-strong: rgba(0,0,0,.22);
      --panel: rgba(255,255,255,.60);

      --shadow: rgba(0,0,0,.18);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--sans);
      min-height:100vh;
      overflow:hidden;
      transition: background .5s ease, color .5s ease;
    }

    /* ====================================================== */
    /* LAYOUT */
    /* ====================================================== */
    .wrap{
      display:grid;
      grid-template-columns: 500px minmax(0,1fr); /* Increased width for larger tiles */
      height:100vh;
    }

    /* LEFT PANEL */
    .left{
      border-right:1px solid var(--border);
      padding:22px 18px;
      display:flex;
      flex-direction:column;
      gap:14px;
      overflow:hidden;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .back{
      width:40px;height:40px;
      border-radius:999px;
      border:1px solid var(--border);
      background:transparent;
      color:var(--text-primary);
      display:grid;
      place-items:center;
      cursor:pointer;
      transition:transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .back:hover{
      transform:translateX(-2px);
      border-color:var(--accent-green);
      background: rgba(156, 243, 93, 0.1);
    }
    body.light-mode .back:hover{ 
      background: rgba(156, 243, 93, 0.15);
    }

    .filters{
      display:flex;
      gap:14px;
      font-family:var(--mono);
      font-size:10px;
      letter-spacing:.22em;
      text-transform:uppercase;
      user-select:none;
      overflow:auto;
      scrollbar-width:none;
      padding: 4px 2px 10px;
    }
    .filters::-webkit-scrollbar{height:0}

    .filter{
      color:var(--text-secondary);
      cursor:pointer;
      padding-bottom:6px;
      border-bottom:1px solid transparent;
      white-space:nowrap;
      opacity:.92;
      transition: color .18s ease, border-color .18s ease;
    }
    .filter.active{
      color:var(--accent-green);
      border-bottom-color:var(--accent-green);
      opacity:1;
      font-weight: 600;
    }

    /* THE TILE LIST - FIXED SIZE TILES */
    .list{
      flex:1;
      overflow:auto;
      padding-right:6px;
      display:flex;
      flex-direction:column;
      gap:16px; /* Fixed gap between tiles */
    }

    .tile{
      position:relative;
      height: 160px; /* FIXED HEIGHT - same for all tiles */
      border-radius: 16px;
      overflow:hidden;
      border: 1px solid var(--border);
      background: #000;
      cursor:pointer;
      transition: transform .18s ease, border-color .18s ease;
      box-shadow: 0 18px 60px rgba(0,0,0,.18);
      flex-shrink: 0; /* Prevent tiles from shrinking */
    }

    .tile:hover{
      transform: translateY(-2px);
      border-color: var(--border-strong);
    }
    .tile.active{
      border-color: var(--accent-green);
      border-width: 2px;
      box-shadow: 0 22px 70px rgba(156, 243, 93, 0.3);
    }

    .tile-media{
      position:absolute;
      inset:0;
      background:#000;
    }
    .tile-video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      filter: saturate(1.05) contrast(1.1); /* Increased saturation and contrast */
      opacity: 1; /* Full opacity - no fading */
    }

    .tile-overlay{
      position:absolute;
      inset:0;
      background: linear-gradient(to bottom, 
        rgba(0,0,0,0) 0%,          /* REMOVED: No dark overlay at top */
        rgba(0,0,0,0.2) 70%,      /* Reduced darkness */
        rgba(0,0,0,0.5) 100%);    /* Reduced darkness at bottom */
      pointer-events:none;
      mix-blend-mode: multiply;    /* Makes overlay blend better */
    }
    body.light-mode .tile-overlay{
      background: linear-gradient(to bottom, 
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.1) 70%,
        rgba(0,0,0,0.2) 100%);
    }

    /* CENTERED THIN TEXT */
    .tile-content{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      pointer-events:none;
      padding: 0 20px;
    }

    .tile-title{
      font-weight: 300; /* Thin weight */
      letter-spacing: .1em;
      color: rgba(255,255,255,.95);
      font-size: 14px;
      line-height: 1.3;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
      max-width: 100%;
      white-space: normal;
      word-wrap: break-word;
    }
    body.light-mode .tile-title{
      color: rgba(255,255,255,.98);
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    /* RIGHT PANEL - UPDATED FOR YOUTUBE EMBED */
    .right{
      padding:26px;
      display:flex;
      flex-direction:column;
      gap:18px;
      overflow:hidden;
    }

    .stage{
      flex:0 0 auto;
      aspect-ratio: 16/9;
      border:1px solid var(--border);
      border-radius:18px;
      overflow:hidden;
      background: var(--panel);
      box-shadow: 0 24px 70px var(--shadow);
      position:relative;
    }

    /* YouTube embed container */
    .video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none; /* Hidden by default */
    }

    .video-container.active {
      display: block;
    }

    .youtube-embed {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 18px;
    }

    /* Thumbnail fallback */
    .stage-bg{
      position:absolute;
      inset:0;
      background-size:cover;
      background-position:center;
      opacity:1; /* Full opacity */
      transform: scale(1.02);
      filter: saturate(1.05) contrast(1.1);
      display: block;
    }

    .stage-bg.hidden {
      display: none;
    }

    .stage-overlay{
      position:absolute;
      inset:0;
      background:
        radial-gradient(700px 320px at 20% 25%, rgba(255,255,255,.08), transparent 60%),
        linear-gradient(180deg, transparent, rgba(0,0,0,.5)); /* Reduced darkness */
      pointer-events:none;
    }
    body.light-mode .stage-overlay{
      background:
        radial-gradient(700px 320px at 20% 25%, rgba(0,0,0,.05), transparent 60%),
        linear-gradient(180deg, transparent, rgba(0,0,0,.15)); /* Reduced darkness */
    }

    /* META / DESCRIPTION */
    .meta{
      overflow:auto;
      padding-right:8px;
    }

    .title{
      font-size: clamp(26px, 3vw, 46px);
      line-height:1.05;
      font-weight:650;
      margin-bottom:10px;
    }

    .subline{
      font-family: var(--mono);
      font-size:11px;
      letter-spacing:.20em;
      text-transform:uppercase;
      color: var(--text-secondary);
      margin-bottom:14px;
    }

    /* GENRE PILLS */
    .genre-row{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:18px;
    }
    .genre-pill{
      font-family: var(--mono);
      font-size:10px;
      letter-spacing:.18em;
      text-transform:uppercase;
      padding: 8px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.04);
      color: var(--text-primary);
      opacity:.92;
      user-select:none;
      transition: border-color .18s ease;
    }
    body.light-mode .genre-pill{
      background: rgba(0,0,0,.03);
    }

    .genre-pill:hover {
      border-color: var(--accent-green);
    }

    .section{
      margin-top:16px;
    }
    .section h3{
      font-family: var(--mono);
      font-size:11px;
      letter-spacing:.22em;
      text-transform:uppercase;
      color: var(--text-secondary);
      margin-bottom:8px;
    }
    .section p{
      font-size: 13px;
      line-height:1.65;
      max-width: 85ch;
      white-space: pre-wrap;
    }

    .actions{
      margin-top:16px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .btn{
      font-family:var(--mono);
      font-size:10px;
      letter-spacing:.22em;
      text-transform:uppercase;
      border:1px solid var(--border);
      padding:10px 14px;
      border-radius:999px;
      background: rgba(255,255,255,.04);
      color: var(--text-primary);
      cursor:pointer;
      text-decoration:none;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    body.light-mode .btn{ background: rgba(0,0,0,.03); }
    .btn:hover{
      transform: translateY(-2px);
      border-color: var(--accent-green);
      background: rgba(156, 243, 93, 0.1);
    }
    body.light-mode .btn:hover{
      background: rgba(156, 243, 93, 0.15);
    }
    .btn.disabled{
      opacity:.45;
      pointer-events:none;
    }

    @media(max-width: 980px){
      body{ overflow:auto; }
      .wrap{ grid-template-columns: 1fr; height:auto; min-height:100vh; }
      .left{ border-right:0; border-bottom:1px solid var(--border); height: 50vh; }
      .right{ height:auto; }
      .tile{ height: 120px; } /* Still fixed height on mobile, just smaller */
    }
  </style>
</head>

        youtubeEmbed: '<iframe width="560" height="315" src="https://www.youtube.com/embed/1APbnF00BGA?si=x6fo5mTTWM6fd8nc&amp;controls=0&amp;autoplay=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>',
        youtubeLink: "https://www.youtube.com/watch?v=1APbnF00BGA"
      },
      {
        title:"Erebus",
        cat:"SHORT",
        meta:"USA · 2020",
        genres:["Horror"],
        synopsis:"A boy fears something lurks in the dark.",
        crew:`Writer, Director, Cinematographer, Editor: MAYANK MEKALA
Starring: MITUL MEKALA`,
        preview:"clips/erebus.mp4",
        thumb:"videothumbs/erebus.jpg",
        youtubeEmbed: '<iframe width="560" height="315" src="https://www.youtube.com/embed/0VTofMqNQTc?si=_SD8JTdhMWR0ugSy&amp;controls=0&amp;autoplay=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>',
        youtubeLink: "https://www.youtube.com/watch?v=0VTofMqNQTc"
      },
      {
        title:"Ghost",
        cat:"SHORT",
        meta:"USA · 2020",
        genres:["Horror","Psychological"],
        synopsis:"A young boy obsesses over a strange entity he encountered in his backyard.",
        crew:`Writer, Director, Cinematographer, Editor: MAYANK MEKALA
Starring: MITUL MEKALA`,
        preview:"clips/ghost.mp4",
        thumb:"videothumbs/ghost.jpg",
        youtubeEmbed: '<iframe width="560" height="315" src="https://www.youtube.com/embed/dZYsp5h3OII?si=HA7RKkPO-iF4nvjk&amp;controls=0&amp;autoplay=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>',
        youtubeLink: "https://www.youtube.com/watch?v=dZYsp5h3OII"
      }
    ];

    let filter = "ALL";
    let visible = [...DATA];
    let index = 0;

    const list = document.getElementById("list");
    const titleEl = document.getElementById("title");
    const sublineEl = document.getElementById("subline");
    const genreRow = document.getElementById("genreRow");
    const synopsisEl = document.getElementById("synopsis");
    const crewEl = document.getElementById("crew");
    const playYoutubeBtn = document.getElementById("playYoutube");
    const stageBg = document.getElementById("stageBg");
    const videoContainer = document.getElementById("videoContainer");
    const synopsisSection = document.getElementById("synopsisSection");
    const crewSection = document.getElementById("crewSection");
    const crewTitle = document.getElementById("crewTitle");

    function createYouTubeEmbed(youtubeEmbed) {
      // Clear existing iframe
      videoContainer.innerHTML = '';
      
      if (!youtubeEmbed) return;
      
      // Add autoplay to the embed code if not already present
      let embedHTML = youtubeEmbed;
      if (embedHTML.includes('?si=') && !embedHTML.includes('autoplay=')) {
        embedHTML = embedHTML.replace('?si=', '?si=');
      }
      
      videoContainer.innerHTML = embedHTML;
      
      // Make sure the iframe fills the container
      const iframe = videoContainer.querySelector('iframe');
      if (iframe) {
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.className = 'youtube-embed';
      }
    }

    function renderList(){
      list.innerHTML = "";
      visible.forEach((d,i)=>{
        const tile = document.createElement("div");
        tile.className = "tile" + (i===index ? " active":"");
        tile.setAttribute("role","button");
        tile.setAttribute("tabindex","0");
        tile.setAttribute("aria-label", d.title);

        tile.innerHTML = `
          <div class="tile-media">
            <video class="tile-video" autoplay muted loop playsinline preload="auto">
              <source src="${d.preview}" type="video/mp4">
            </video>
          </div>
          <div class="tile-overlay"></div>
          <div class="tile-content">
            <div class="tile-title">${d.title}</div>
          </div>
        `;

        tile.addEventListener("click", ()=>{ index=i; render(); });
        tile.addEventListener("keydown",(e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); index=i; render(); } });

        list.appendChild(tile);
      });

      // Ensure all videos start playing
      setTimeout(() => {
        document.querySelectorAll('.tile-video').forEach(video => {
          video.play().catch(e => {
            console.log("Video autoplay failed:", e);
            // Try again with user interaction simulation
            video.muted = true;
            video.play().catch(e2 => console.log("Second attempt failed:", e2));
          });
        });
      }, 100);
    }

    function setStage(item){
      // Check if item has YouTube embed
      if (item.youtubeEmbed && item.youtubeEmbed.trim().length > 0) {
        // Show YouTube embed
        stageBg.classList.add('hidden');
        videoContainer.classList.add('active');
        
        // Create the YouTube embed
        createYouTubeEmbed(item.youtubeEmbed);
      } else {
        // Show thumbnail instead
        stageBg.classList.remove('hidden');
        videoContainer.classList.remove('active');
        videoContainer.innerHTML = ''; // Clear YouTube iframe
        
        stageBg.style.backgroundImage = item.thumb ? `url('${item.thumb}')` : "none";
      }
    }

    function renderGenres(item){
      genreRow.innerHTML = "";
      const arr = Array.isArray(item.genres) ? item.genres : [];
      if(!arr.length){
        const p = document.createElement("span");
        p.className = "genre-pill";
        p.textContent = "—";
        genreRow.appendChild(p);
        return;
      }
      arr.forEach(g=>{
        const pill = document.createElement("span");
        pill.className = "genre-pill";
        pill.textContent = String(g).toUpperCase();
        genreRow.appendChild(pill);
      });
    }

    function render(){
      const d = visible[index];
      if(!d) return;

      titleEl.textContent = d.title || "";
      sublineEl.textContent = d.meta || "";

      renderGenres(d);

      // Set synopsis text
      synopsisEl.textContent = d.synopsis || "(Add synopsis when ready.)";
      
      // Set crew text
      crewEl.textContent = d.crew || "(Add credits when ready.)";

      // Show/hide sections and change title based on category
      if (d.cat === "MUSIC") {
        // For music videos: hide synopsis, show crew with "ARTISTS" title
        synopsisSection.style.display = "none";
        crewSection.style.display = "block";
        crewTitle.textContent = "ARTISTS";
      } else {
        // For other categories: show both sections with "CAST & CREW" title
        synopsisSection.style.display = "block";
        crewSection.style.display = "block";
        crewTitle.textContent = "CAST & CREW";
      }

      setStage(d);

      // Update YouTube button
      if(d.youtubeLink && d.youtubeLink.trim().length){
        playYoutubeBtn.classList.remove("disabled");
        playYoutubeBtn.onclick = () => {
          window.open(d.youtubeLink, '_blank');
        };
      } else {
        playYoutubeBtn.classList.add("disabled");
        playYoutubeBtn.onclick = null;
      }

      // Update active tile highlighting
      document.querySelectorAll(".tile").forEach((n,i)=>n.classList.toggle("active", i===index));
    }

    // filters
    document.querySelectorAll(".filter").forEach(f=>{
      f.addEventListener("click", ()=>{
        document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
        f.classList.add("active");
        filter = f.dataset.filter;

        visible = (filter==="ALL") ? [...DATA] : DATA.filter(x=>x.cat===filter);
        index = 0;
        renderList();
        render();
      });
    });

    // prev/next
    document.getElementById("prev").addEventListener("click", ()=>{
      // Clear YouTube iframe
      videoContainer.innerHTML = '';
      videoContainer.classList.remove('active');
      stageBg.classList.remove('hidden');
      
      index = Math.max(0, index-1);
      render();
    });
    
    document.getElementById("next").addEventListener("click", ()=>{
      // Clear YouTube iframe
      videoContainer.innerHTML = '';
      videoContainer.classList.remove('active');
      stageBg.classList.remove('hidden');
      
      index = Math.min(visible.length-1, index+1);
      render();
    });

    // Ensure videos keep playing
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        document.querySelectorAll('.tile-video').forEach(video => {
          if (video.paused) {
            video.play().catch(e => console.log("Visibility change play failed:", e));
          }
        });
      }
    });

    // init
    renderList();
    render();
  </script>
</body>
</html>
