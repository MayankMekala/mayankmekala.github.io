<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MKXSPHERE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Full-screen black background */
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Helvetica', sans-serif; 
      color: #000;
    }
    /* Container for particles.js */
    #tsparticles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    /* MODIFIED: This wrapper is now the main anchor.
       It's centered, and its children (logo, dialog) 
       will be positioned relative to it. */
    #center-content {
      position: absolute;
      top: 50%;
      left: 50%;
      /* This transform centers the whole container */
      transform: translate(-50%, -50%);
      z-index: 2;
      text-align: center;
    }

    /* MODIFIED: Logo animation */
    #logo-container {
      /* Starts invisible */
      opacity: 0; 
      /* This new animation fades in, holds, then moves up */
      animation: logoIntro 2.5s ease-out forwards 0.5s;
      margin-bottom: 15px; 
    }

    #logo {
      width: 240px; 
      height: auto;
    }

    /* MODIFIED: Dialogue box animation */
    #dialog {
      width: 240px; 
      background: rgba(255,255,255,0.9);
      padding: 15px; 
      border: 4px solid #000;
      border-radius: 10px;
      box-shadow:
        0 2px 0 0 #000,
        inset 0 2px 0 0 #000,
        0 0 0 2px #000,
        inset 0 0 0 2px #000;
      font-size: 14px; 
      font-weight: bold; 
      line-height: 1.4;
      text-align: center;
      color: #000;
      box-sizing: border-box; 
      
      /* Starts invisible and scaled to zero */
      opacity: 0;
      transform: scale(0);
      /* This new animation expands it from the center */
      animation: dialogExpand 0.8s ease-out forwards 2.5s;
    }

    /* NEW: Keyframes for the logo */
    @keyframes logoIntro {
      /* 0-40%: Fade in and stay centered */
      0% {
        opacity: 0;
        transform: translateY(0);
      }
      40% {
        opacity: 1;
        transform: translateY(0);
      }
      /* 40-100%: Move up gracefully */
      100% {
        opacity: 1;
        /* Moves up by 85px (half dialog height + margin) */
        transform: translateY(-85px); 
      }
    }

    /* NEW: Keyframes for the dialog box expansion */
    @keyframes dialogExpand {
      from {
        opacity: 0;
        transform: scale(0);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    /* Blinking arrow indicator */
    .arrow {
      width: 0; height: 0;
      border: 6px solid transparent; 
      border-top-color: #000;
      margin: 8px auto 0; 
      animation: blink 1s step-start infinite;
      visibility: hidden;
    }
    @keyframes blink {
      0%, 49% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="tsparticles"></div>
  
  <div id="center-content">
    <div id="logo-container">
      <img src="homeluxlogo/primewhite.png" id="logo" alt="MKX Logo">
    </div>
    
    <div id="dialog">
      <span id="dialog-text"></span>
      <div class="arrow" id="arrow"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tsparticles/3.9.1/tsparticles.min.js"></script>
  <script>
    /* Initialize particles... (no changes) */
    tsParticles.load("tsparticles", {
      fpsLimit: 60,
      particles: {
        number: { value: 80, density: { enable: true, value_area: 800 } },
        color: { value: "#ffffff" },
        shape: { type: "circle" },
        opacity: {
          value: 0.8, random: true,
          anim: { enable: true, speed: 1, opacity_min: 0.3, sync: false }
        },
        size: {
          value: 4, random: true,
          anim: { enable: true, speed: 2, size_min: 1, sync: false }
        },
        links: { enable: false },
        move: {
          enable: true, speed: 0.5,
          direction: "none", random: true,
          straight: false, out_mode: "out"
        }
      },
      interactivity: {
        detect_on: "canvas",
        events: { onhover: { enable: false }, onclick: { enable: false }, resize: true }
      },
      retina_detect: true,
      background: { color: "#000000" }
    });
  </script>
  <script>
    // Text to display in dialogue
    const message = "Welcome to the MKXSPHERE! Are you ready to enter?";
    const dialogText = document.getElementById("dialog-text");
    const arrow = document.getElementById("arrow");
    let index = 0;

    // Typewriter effect
    function typeWriter() {
      if (index < message.length) {
        dialogText.textContent += message.charAt(index);
        index++;
        setTimeout(typeWriter, 50);
      } else {
        arrow.style.visibility = "visible";
      }
    }

    // MODIFIED: Start typing after the dialog expand animation is done.
    // Dialog animation delay (2.5s) + duration (0.8s) = 3.3s
    window.addEventListener("load", () => {
      setTimeout(typeWriter, 3300); // 3300ms = 3.3s
    });

    // Enter key or click to go to home.html
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        window.location.href = "home.html";
      }
    });
    document.getElementById("dialog").addEventListener("click", () => {
      window.location.href = "home.html";
    });
  </script>
</body>
</html>
