<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MKXSPHERE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Full-screen black background */
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Helvetica', sans-serif;  
      color: #000;
    }
    /* Container for particles.js */
    #tsparticles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    /* This wrapper is now the main anchor */
    #center-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      text-align: center;
    }

    /* Logo animation */
    #logo-container {
      opacity: 0;  
      animation: logoIntro 2.5s ease-in-out forwards 0.5s;
      margin-bottom: 10px; 
    }

    #logo {
      width: 240px;  
      height: auto;
    }

    /* Dialogue box styles */
    #dialog {
      width: 240px;  
      font-size: 14px;  
      font-weight: bold;  
      line-height: 1.4;
      text-align: center;
      color: #fff; 
      box-sizing: border-box;  
      
      opacity: 0;
      animation: dialogExpand 0.8s ease-out forwards 2.5s;
      
      /* MODIFIED: Reserves space for text to prevent layout jerk */
      min-height: 40px; 
    }

    /* Keyframes for a smoother logo intro */
    @keyframes logoIntro {
      0% {
        opacity: 0;
        transform: translateY(0);
      }
      100% {
        opacity: 1;
        transform: translateY(-40px);  
      }
    }

    /* Keyframes for dialog box now only fade in */
    @keyframes dialogExpand {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    
    /* Blinking arrow indicator */
    .arrow {
      width: 0; height: 0;
      border: 6px solid transparent;  
      border-top-color: #fff; 
      margin: 8px auto 0;  
      animation: blink 1s step-start infinite;
      visibility: hidden;
    }
    @keyframes blink {
      0%, 49% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="tsparticles"></div>
  
  <div id="center-content">
    <div id="logo-container">
      <img src="homeluxlogo/primewhite.png" id="logo" alt="MKX Logo">
    </div>
    
    <div id="dialog">
      <span id="dialog-text">&nbsp;</span>
      <div class="arrow" id="arrow"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tsparticles/3.9.1/tsparticles.min.js"></script>
  <script>
    /* Initialize particles... (no changes) */
    tsParticles.load("tsparticles", {
      fpsLimit: 60,
      particles: {
        number: { value: 80, density: { enable: true, value_area: 800 } },
        color: { value: "#ffffff" },
        shape: { type: "circle" },
        opacity: {
          value: 0.8, random: true,
          anim: { enable: true, speed: 1, opacity_min: 0.3, sync: false }
        },
        size: {
          value: 4, random: true,
          anim: { enable: true, speed: 2, size_min: 1, sync: false }
        },
        links: { enable: false },
        move: {
          enable: true, speed: 0.5,
          direction: "none", random: true,
          straight: false, out_mode: "out"
        }
      },
      interactivity: {
        detect_on: "canvas",
        events: { onhover: { enable: false }, onclick: { enable: false }, resize: true }
      },
      retina_detect: true,
      background: { color: "#000000" }
    });
  </script>
  <script>
    // Text split into an array
    const messages = [
      "Welcome to the MKXSPHERE!",
      "Are you ready to enter?"
    ];
    const dialogText = document.getElementById("dialog-text");
    const arrow = document.getElementById("arrow");
    
    let messageIndex = 0;
    let charIndex = 0;
    let hasCleared = false; // MODIFIED: Flag to clear placeholder

    // MODIFIED: Typewriter effect to handle multiple lines
    function typeWriter() {
      // MODIFIED: Clears the placeholder &nbsp; on first run
      if (!hasCleared) {
        dialogText.innerHTML = "";
        hasCleared = true;
      }

      if (messageIndex >= messages.length) {
        arrow.style.visibility = "visible"; // All done
        return;
      }

      let currentMessage = messages[messageIndex];
      if (charIndex < currentMessage.length) {
        // Type the next character
        dialogText.innerHTML += currentMessage.charAt(charIndex);
        charIndex++;
        setTimeout(typeWriter, 50);
      } else {
        // Finished this line
        messageIndex++;
        charIndex = 0;
        if (messageIndex < messages.length) {
          // If there's another line, add a <br> and continue
          dialogText.innerHTML += "<br>";
          setTimeout(typeWriter, 50); // Continue to next line
        } else {
          // No more lines, show arrow
          arrow.style.visibility = "visible";
        }
      }
    }

    // Start typing after the dialog expand animation is done.
    // Dialog animation delay (2.5s) + duration (0.8s) = 3.3s
    window.addEventListener("load", () => {
      setTimeout(typeWriter, 3300); // 3300ms = 3.3s
    });

    // Enter key or click to go to home.html
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        window.location.href = "home.html";
      }
    });
    document.getElementById("dialog").addEventListener("click", () => {
      window.location.href = "home.html";
    });
  </script>
</body>
</html>
