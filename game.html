<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MKX GAME </title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    :root{
      /* Cinema-style tokens */
      --bg-dark:
        radial-gradient(circle at 0% -20%, #1f2937 0, #020617 45%, #000 100%);
      --bg-light:
        radial-gradient(
          circle at 30% 0%,
          rgba(255,255,255,1) 0%,
          rgba(245,248,255,0.95) 35%,
          rgba(230,235,255,0.90) 70%,
          rgba(210,220,245,0.85) 100%
        ),
        linear-gradient(
          135deg,
          rgba(255,255,255,0.85),
          rgba(230,235,250,0.90)
        );
      --text-dark: #f5f5f5;
      --text-light: #050816;
      --accent-green: #9cf35d;
      --accent-blue: #46a6ff;
      --accent-orange: #ffbb00;

      --card-border-dark: rgba(148,163,184,0.45);
      --card-border-light: rgba(0,0,0,0.12);

      --bg-panel-dark: radial-gradient(circle at 0 0, #020617 0, #020617 40%, #020617 100%);
      --bg-panel-light: rgba(255,255,255,0.94);

      /* defaults = NOX */
      --bg-primary: var(--bg-dark);
      --bg-panel: var(--bg-panel-dark);
      --text-primary: var(--text-dark);
      --text-secondary: #a1a5b5;

      --border-color-y2k: rgba(15,23,42,0.9);
      --bubble-edge: #111827;
      --bubble-glow: rgba(0,0,0,0.6);
      --bezel-dark-inner: #020617;
    }

    body.light-mode{
      --bg-primary: var(--bg-light);
      --bg-panel: var(--bg-panel-light);
      --text-primary: var(--text-light);
      --text-secondary: #555;
      --border-color-y2k: rgba(0,0,0,0.12);
      --bubble-edge: #e5e7eb;
      --bubble-glow: rgba(0,0,0,0.12);
      --bezel-dark-inner: #e5e7eb;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background:var(--bg-primary);
      color:var(--text-primary);
      font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      overflow-x:hidden;
      overflow-y:auto;
      min-height:100vh;
      transition:background .5s ease,color .5s ease;
    }

    /* ---------- HEADER ---------- */

    .console-container{
      width:100%;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      position:relative;
    }

    .console-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:radial-gradient(circle at -10% -120%, #1e293b 0, #020617 50%, #020617 100%);
      height:90px;
      padding:0 2.5vw;
      border-bottom:1px solid rgba(15,23,42,0.85);
      box-shadow:0 14px 40px rgba(0,0,0,0.75);
      position:relative;
      z-index:10;
    }
    body.light-mode .console-header{
      background:linear-gradient(135deg,#ffffff,#f2ebe1);
      border-bottom:1px solid rgba(0,0,0,0.08);
      box-shadow:0 10px 34px rgba(15,23,42,0.18);
    }

    .header-left,.header-right{flex:1;display:flex;align-items:center}
    .header-right{justify-content:flex-end}
    .header-left{gap:14px;}

    .back-arrow{
      width:34px;
      height:34px;
      border-radius:999px;
      border:1px solid rgba(148,163,184,0.55);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      background:rgba(15,23,42,0.95);
      color:var(--text-primary);
      text-decoration:none;
      transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease,background .2s ease,color .2s ease;
    }
    .back-arrow i{font-size:14px;}
    .back-arrow:hover{
      transform:translateX(-2px);
      border-color:var(--accent-green);
      box-shadow:0 0 0 1px rgba(156,243,93,0.6);
      background:#020617;
    }
    body.light-mode .back-arrow{
      background:#ffffff;
      border-color:rgba(0,0,0,0.12);
      color:#020617;
    }
    body.light-mode .back-arrow:hover{
      background:#020617;
      color:#f9fafb;
      box-shadow:0 8px 24px rgba(0,0,0,0.25);
      border-color:#020617;
    }

    .mode-indicator{
      font-size:10px;
      font-weight:600;
      letter-spacing:0.18em;
      text-transform:uppercase;
      padding:4px 11px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,rgba(82,101,32,0.85),rgba(15,23,42,0.95));
      border:1px solid rgba(148,163,184,0.55);
      color:#e5f9cb;
      text-shadow:0 0 12px rgba(156,243,93,0.9);
      box-shadow:0 0 20px rgba(156,243,93,0.35);
      transition:background .3s ease,border-color .3s ease,color .3s ease,box-shadow .3s ease;
    }
    body.light-mode .mode-indicator{
      background:linear-gradient(135deg,rgba(156,243,93,0.75),#ffffff);
      border-color:rgba(0,0,0,0.12);
      color:#020617;
      text-shadow:none;
      box-shadow:0 10px 26px rgba(0,0,0,0.18);
    }

    .weather-display {
      display:flex;
      align-items:center;
      gap:8px;
      font-size:13px;
      font-weight:600;
      padding:5px 10px;
      border-radius:999px;
      border:1px solid rgba(148,163,184,0.55);
      margin-left:10px;
      background:radial-gradient(circle at 0 0,rgba(15,23,42,0.9) 0,rgba(15,23,42,0.7) 60%,rgba(15,23,42,0.6) 100%);
      color:var(--text-primary);
      white-space:nowrap;
    }
    body.light-mode .weather-display{
      background:rgba(255,255,255,0.9);
      border-color:rgba(0,0,0,0.12);
    }
    .weather-icon{
      font-size:16px;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* Icon colors + glows */
    .weather-icon .fa-sun{
      color:#ffd700;
      text-shadow:0 0 6px rgba(255,215,0,0.8),0 0 14px rgba(255,215,0,0.9);
      animation:weather-sun 3s ease-in-out infinite;
    }
    .weather-icon .fa-moon{
      color:#ffffff;
      text-shadow:0 0 6px rgba(255,255,255,0.8),0 0 12px rgba(255,255,255,0.8);
      animation:weather-moon 3.4s ease-in-out infinite;
    }
    /* LUX override: moon becomes grey in light mode */
    body.light-mode .weather-icon .fa-moon{
      color:#9ca3af;
      text-shadow:0 0 6px rgba(156,163,175,0.8),
                  0 0 12px rgba(156,163,175,0.9);
    }
    .weather-icon .fa-cloud-showers-heavy,
    .weather-icon .fa-bolt,
    .weather-icon .fa-snowflake{
      color:#66aaff;
      text-shadow:0 0 8px rgba(102,170,255,0.9),0 0 16px rgba(102,170,255,0.9);
      animation:weather-rain 2.8s ease-in-out infinite;
    }
    .weather-icon .fa-cloud,
    .weather-icon .fa-cloud-sun,
    .weather-icon .fa-cloud-moon,
    .weather-icon .fa-smog{
      color:#b0b7c3;
      text-shadow:0 0 5px rgba(148,163,184,0.9);
      animation:weather-cloud 4s ease-in-out infinite;
    }

    @keyframes weather-sun{
      0%,100%{text-shadow:0 0 6px rgba(255,215,0,0.8),0 0 14px rgba(255,215,0,0.9);}
      50%{text-shadow:0 0 10px rgba(255,215,0,1),0 0 22px rgba(255,215,0,1);}
    }
    @keyframes weather-moon{
      0%,100%{text-shadow:0 0 6px rgba(255,255,255,0.7),0 0 12px rgba(255,255,255,0.8);}
      50%{text-shadow:0 0 10px rgba(255,255,255,1),0 0 20px rgba(255,255,255,1);}
    }
    @keyframes weather-rain{
      0%,100%{text-shadow:0 0 6px rgba(102,170,255,0.85),0 0 14px rgba(102,170,255,0.9);}
      50%{text-shadow:0 0 12px rgba(102,170,255,1),0 0 24px rgba(102,170,255,1);}
    }
    @keyframes weather-cloud{
      0%,100%{text-shadow:0 0 4px rgba(148,163,184,0.9);}
      50%{text-shadow:0 0 9px rgba(148,163,184,1);}
    }

    #weather-temp{font-weight:700;}

    .mode-indicator + .weather-display{margin-left:12px;}

    /* Center logo + circle plate */

    .header-center{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%, -40%);
      pointer-events:none;
    }

    .logo-plate{
      width:230px;
      height:230px;
      border-radius:999px;
      background:radial-gradient(circle at 30% 0%,#111827 0,#020617 50%,#000 100%);
      box-shadow:0 18px 60px rgba(0,0,0,0.9);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      border:1px solid rgba(15,23,42,0.95);
    }
    body.light-mode .logo-plate{
      background:radial-gradient(circle at 20% 0%,#ffffff 0,#e5e7eb 48%,#cbd5f5 100%);
      border-color:rgba(0,0,0,0.12);
      box-shadow:0 16px 40px rgba(15,23,42,0.24);
    }

    .logo-plate img{
      max-width:76%;
      max-height:76%;
      object-fit:contain;
      filter:drop-shadow(0 0 12px rgba(0,0,0,0.9));
      transform:translateY(2px);
    }
    body.light-mode .logo-plate img{
      filter:none;
    }

    /* Right-side indicators */

    .system-indicators{display:flex;align-items:center;gap:14px}
    .crt-toggle{
      background:none;
      border:1px solid rgba(148,163,184,0.6);
      color:var(--text-secondary);
      padding:6px 12px;
      border-radius:999px;
      font-size:11px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:0.12em;
      cursor:pointer;
      transition:background .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease;
      white-space:nowrap;
    }
    .crt-toggle.active,
    .crt-toggle:hover{
      color:#0b1120;
      background:linear-gradient(135deg,var(--accent-green),#cfff8a);
      border-color:var(--accent-green);
      box-shadow:0 10px 26px rgba(156,243,93,0.45);
    }

    .wifi-icon{display:flex;align-items:flex-end;gap:2px;height:20px;}
    .wifi-icon .bar,.wifi-icon .dot{
      background-color:var(--accent-green);
      box-shadow:0 0 6px rgba(156,243,93,0.9);
    }
    .wifi-icon .dot{width:4px;height:4px;border-radius:50%;}
    .wifi-icon .bar{width:4px;border-radius:2px; opacity: 0.2;}
    .wifi-icon .bar1{height:6px; animation: wifi-signal-search 2.5s infinite .2s;}
    .wifi-icon .bar2{height:12px; animation: wifi-signal-search 2.5s infinite .4s;}
    .wifi-icon .bar3{height:18px; animation: wifi-signal-search 2.5s infinite .6s;}
    .wifi-icon .dot { animation: wifi-signal-search 2.5s infinite;}
    @keyframes wifi-signal-search {
      0%, 100% { opacity: 0.2; }
      30%, 70% { opacity: 1; }
    }

    .clock{
      font-size:13px;
      font-weight:700;
      letter-spacing:0.12em;
      text-transform:uppercase;
      color:#ffffff;
      text-shadow:none;
      white-space:nowrap;
    }
    body.light-mode .clock{
      color:#111827;
      text-shadow:none;
    }

    /* ---------- CHANNEL STRIP ---------- */

    .game-channels{
      flex-grow:1;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow-x:auto;
      padding:40px 6vw 28px;
      gap:2.5vw;
      scroll-snap-type:x mandatory;
    }
    .game-channels::-webkit-scrollbar{display:none}

    .channel-card{
      position:relative;
      flex:0 0 280px;
      height:180px;
      border-radius:22px;
      padding:4px;
      background:radial-gradient(circle at 0 0,rgba(156,243,93,0.18),rgba(15,23,42,1) 55%);
      border:1px solid var(--card-border-dark);
      background-size:cover;
      background-position:center;
      box-shadow:0 10px 35px rgba(0,0,0,0.7);
      scroll-snap-align:center;
      transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
    }
    body.light-mode .channel-card{
      background:radial-gradient(circle at 0 0,rgba(156,243,93,0.22),#ffffff 45%);
      border:1px solid var(--card-border-light);
      box-shadow:0 10px 30px rgba(15,23,42,0.18);
    }

    .channel-card:hover,
    .channel-card.active{
      transform:translateY(-6px);
      border-color:var(--accent-green);
      box-shadow:0 24px 46px rgba(0,0,0,0.85);
    }
    body.light-mode .channel-card:hover,
    body.light-mode .channel-card.active{
      box-shadow:0 22px 40px rgba(15,23,42,0.25);
    }

    .channel-card[data-title="Collision Course"]{background-image:url('gamethumb/ccthumb.png')}
    .channel-card[data-title="Squirrel"]{
      background-image:url('gamethumb/sqthumb.png');
      background-size:contain;
      background-repeat:no-repeat;
      background-position:center bottom;
    }

    /* LUX MODE: ensure thumbnails still show */
    body.light-mode .channel-card[data-title="Collision Course"]{
      background-image:url('gamethumb/ccthumb.png');
    }
    body.light-mode .channel-card[data-title="Squirrel"]{
      background-image:url('gamethumb/sqthumb.png');
      background-size:contain;
      background-repeat:no-repeat;
      background-position:center bottom;
    }

    /* ---------- INFO PANEL (BOTTOM) ---------- */

    .info-panel{
      padding:2.4vw 3vw;
      min-height:260px;
      background:var(--bg-panel);
      position:relative;
      z-index:10;
      border-top-left-radius:50% 26px;
      border-top-right-radius:50% 26px;
      box-shadow:0 -14px 40px rgba(0,0,0,0.8);
      border-top:1px solid var(--border-color-y2k);
      border-left:1px solid var(--border-color-y2k);
      border-right:1px solid var(--border-color-y2k);
    }
    body.light-mode .info-panel{
      box-shadow:0 -10px 28px rgba(15,23,42,0.2);
    }

    .game-title,.game-subheader,.game-description,.status-text,.play-button-container{opacity:0;transform:translateY(10px);animation:fadeIn .5s forwards}
    .game-title{
      font-size:30px;
      font-weight:700;
      letter-spacing:-0.02em;
      color:var(--text-primary);
    }
    .game-subheader{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:13px;
      font-weight:700;
      text-transform:uppercase;
      margin:10px 0;
      animation-delay:.05s;
      color:var(--text-secondary);
    }
    .game-subheader.online{
      color:var(--accent-green);
      text-shadow:0 0 12px rgba(156,243,93,0.8);
    }
    .game-subheader.download{
      color:var(--accent-blue);
      text-shadow:0 0 12px rgba(70,166,255,0.8);
    }

    body[class*="theme-"] .game-subheader.online { color: var(--accent-green) !important; }
    body[class*="theme-"] .game-subheader.download { color: var(--accent-blue) !important; }

    .game-subheader .icon.download {
        display:inline-block;
        animation:download-animation 1.5s infinite ease-in-out;
    }
    @keyframes download-animation {
        0%, 100% { transform: translateY(0); opacity: 1; }
        50% { transform: translateY(4px); opacity: 0.6; }
    }

    .game-description{
      font-size:15px;
      color:var(--text-secondary);
      max-width:680px;
      line-height:1.7;
      margin-bottom:18px;
      animation-delay:.1s;
    }
    .status-text{
      font-size:13px;
      font-weight:700;
      font-style:italic;
      margin-bottom:18px;
      animation-delay:.15s;
      color:var(--text-primary);
    }
    .play-button-container{animation-delay:.18s;}

    .play-button{
      display:inline-flex;
      align-items:center;
      gap:10px;
      background:linear-gradient(135deg,var(--accent-green),#90ffca);
      color:#020617;
      text-decoration:none;
      padding:12px 26px;
      border-radius:999px;
      font-weight:700;
      font-size:12px;
      letter-spacing:0.14em;
      text-transform:uppercase;
      border:none;
      box-shadow:0 14px 40px rgba(156,243,93,0.7);
      transition:transform .2s ease,box-shadow .2s ease;
    }
    .play-button:hover{
      transform:translateY(-1px) scale(1.02);
      box-shadow:0 20px 50px rgba(156,243,93,0.9);
    }

    @keyframes fadeIn{to{opacity:1;transform:translateY(0)}}
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 0.6; transform: translateY(0); } }

    /* ---------- MKX SYSTEMS PILL ---------- */

    .system-status{
      position:fixed !important;
      bottom:1.3rem;
      right:2rem;
      display:flex;
      align-items:center;
      gap:0.6rem;
      font-size:11px;
      color:var(--text-secondary);
      letter-spacing:0.5px;
      opacity:1;
      transform:translateY(0);
      animation:fadeInUp 1.5s ease 0.2s forwards;
      font-weight:700;
      text-transform:uppercase;
      cursor:default;
      z-index:2000;
      background:rgba(15,23,42,0.96);
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(148,163,184,0.7);
      pointer-events:auto;
      backdrop-filter:blur(5px);
    }
    body.light-mode .system-status{
      background:rgba(255,255,255,0.92);
      border-color:rgba(0,0,0,0.15);
      box-shadow:0 10px 30px rgba(15,23,42,0.15);
    }
    .system-status:hover { opacity:1; }

    .system-status .label { font-weight:800; color:var(--text-primary); margin-right:8px; }
    .status-indicator {
        width:10px;
        height:10px;
        border-radius:50%;
        background-color:var(--accent-green);
        box-shadow:0 0 10px 3px rgba(156,243,93,0.55);
        animation:pulse 2s infinite;
        flex-shrink:0;
        order:2;
    }
    @keyframes pulse {
        0% { box-shadow:0 0 0 0 rgba(156,243,93,0.7); transform:scale(0.96); }
        50% { box-shadow:0 0 0 8px rgba(156,243,93,0); transform:scale(1.06); }
        100% { box-shadow:0 0 0 0 rgba(156,243,93,0.7); transform:scale(0.96); }
    }

    /* ---------- SYSTEM NOTIFICATION ---------- */

    .system-notification{
      position:fixed;
      bottom:20px;
      right:20px;
      width:360px;
      max-width:90vw;
      background:#fff;
      color:#000;
      border-left:8px solid var(--accent-orange);
      padding:14px;
      border-radius:8px;
      box-shadow:0 8px 30px rgba(0,0,0,.12);
      z-index:1000;
      transform:translateY(30px);
      opacity:0;
      transition:all .45s;
    }
    .system-notification.show{opacity:1;transform:translateY(0)}
    .close-notification{
      position:absolute;
      top:6px;
      right:8px;
      cursor:pointer;
      color:#666;
      font-size:20px;
    }

    /* CRT overlay */

    .crt-effect::after{
      content:" ";
      display:block;
      position:fixed;
      top:0;left:0;bottom:0;right:0;
      background:
        linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%),
        linear-gradient(90deg, rgba(255,0,0,0.04), rgba(0,255,0,0.02), rgba(0,0,255,0.04));
      z-index:1001;
      background-size:100% 4px,3px 100%;
      pointer-events:none;
      animation:crt-flicker 0.15s infinite;
      opacity:0.28;
    }
    @keyframes crt-flicker { 0% { opacity: 0.22; } 50% { opacity: 0.30; } 100% { opacity: 0.24; } }

    /* ---------- RESPONSIVE ---------- */

    @media(max-width:900px){
      .console-header{
        height:70px;
        padding:0 16px;
      }

      .header-center{display:none;}
      .console-header{justify-content:space-between;}

      .header-left{
        gap:8px;
      }

      .mode-indicator{
        display:none;
      }

      .weather-display{
        margin-left:6px;
        padding:4px 8px;
        font-size:12px;
      }

      .system-indicators{
        gap:8px;
      }

      .clock{
        font-size:11px;
        letter-spacing:0.08em;
      }

      .game-channels{
        flex-grow:0;
        flex-shrink:0;
        flex-basis:auto;
        align-items:stretch;
        justify-content:flex-start;
        flex-direction:row;
        padding:20px 16px 16px;
        gap:16px;
        scroll-snap-type:x mandatory;
      }

      .channel-card{
        flex:0 0 240px;
        height:160px;
        border-radius:18px;
      }

      .info-panel{
        padding:18px 16px 20px;
        min-height:auto;
        border-top-left-radius:24px;
        border-top-right-radius:24px;
      }

      .game-title{
        font-size:22px;
      }

      .game-description{
        font-size:14px;
      }

      .system-status{
        bottom:0.9rem;
        right:1rem;
        font-size:10px;
        padding:6px 10px;
      }

      .system-notification{
        right:12px;
        left:12px;
        width:auto;
      }
    }

    @media(max-width:600px){
      .game-channels{
        flex-direction:column;
        overflow-x:hidden;
        overflow-y:visible;
        scroll-snap-type:none;
      }

      .channel-card{
        width:100%;
        max-width:100%;
        flex:0 0 auto;
      }
    }

  </style>
</head>
<body id="body">

  <div class="console-container">
    <header class="console-header">
      <div class="header-left">
        <a href="home.html" class="back-arrow"><i class="fas fa-chevron-left"></i></a>
        <div class="mode-indicator" id="modeIndicator">NOX MODE</div>
        <div class="weather-display" id="weather-display">
          <span class="weather-icon"><i class="fas fa-cloud"></i></span>
          <span id="weather-temp">--&deg;</span>
        </div>
      </div>

      <div class="header-center" aria-hidden="true">
        <div class="logo-plate">
          <img src="logopack/4.png" alt="MKX GAME Logo" id="centerLogoImg">
        </div>
      </div>

      <div class="header-right">
        <div class="system-indicators">
          <button class="crt-toggle" id="crtToggle">CRT OFF</button>
          <div class="wifi-icon" aria-hidden="true">
            <div class="dot"></div><div class="bar bar1"></div><div class="bar bar2"></div><div class="bar bar3"></div>
          </div>
          <div class="clock" id="clock"></div>
        </div>
      </div>
    </header>

    <main class="game-channels" id="game-channels" role="list">
      <div class="channel-card active"
           data-title="Squirrel"
           data-subheader-type="online"
           data-description="Winter starts in 60 seconds! Collect as many nuts as you can before the time runs out.<br><b>Developer:</b> Mayank Mekala"
           data-link="squirrel.html"
           data-button-text="PLAY NOW"
           data-status=""></div>

      <div class="channel-card"
           data-title="Collision Course"
           data-subheader-type="online"
           data-description="Pilot a ship through an asteroid belt without getting hit.<br><b>Developer:</b> Mayank Mekala"
           data-link="collisongame.html"
           data-button-text="PLAY NOW"
           data-status=""></div>
    </main>

    <footer class="info-panel" id="info-panel"></footer>
  </div>

  <div class="system-status" id="persistentSystemStatus" role="status" aria-live="polite" aria-atomic="true">
    <span class="label">MKX SYSTEMS</span>
    <div class="status-indicator" aria-hidden="true"></div>
  </div>

  <div class="system-notification" id="systemNotification" role="status" aria-live="polite">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="font-size:22px;color:var(--accent-orange)"><i class="fas fa-exclamation-circle"></i></div>
      <div>
        <div style="font-weight:700;color:#000">System Notification</div>
        <div style="font-size:13px;color:#333">New updates are available.</div>
      </div>
    </div>
    <div class="close-notification" id="closeNotification" aria-label="Close Notification">&times;</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const body = document.getElementById('body');
      const modeIndicator = document.getElementById('modeIndicator');
      const clockElement = document.getElementById('clock');
      const channels = document.querySelectorAll('.channel-card');
      const infoPanel = document.getElementById('info-panel');
      const crtToggle = document.getElementById('crtToggle');
      const systemNotification = document.getElementById('systemNotification');
      const closeNotification = document.getElementById('closeNotification');
      const weatherDisplay = document.getElementById('weather-display');
      const weatherIcon = weatherDisplay.querySelector('.weather-icon');
      const weatherTemp = document.getElementById('weather-temp');

      const OPENWEATHER_API_KEY = 'dcc0278dfda65b672aa4c89ddcbda3a6';
      const FALLBACK_CITY = 'San Ramon';
      const UNITS = 'imperial';
      const HOURLY_INTERVAL = 3600000;

      function applySavedPreferences(){
        const savedTheme = localStorage.getItem('theme') || 'default';
        const savedMode = localStorage.getItem('mode') || 'dark';
        body.className = '';
        if(savedTheme !== 'default'){
          body.classList.add(`theme-${savedTheme}`);
          modeIndicator.textContent = `${savedTheme.toUpperCase()} THEME`;
        } else {
          body.classList.toggle('light-mode', savedMode === 'light');
          modeIndicator.textContent = (savedMode === 'light') ? 'LUX MODE' : 'NOX MODE';
        }
        if (localStorage.getItem('crtEffect') === 'true') {
            body.classList.add('crt-effect');
        }
      }

      function updateClock(){
        const now = new Date();
        const timeString = now.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
        const dateString = now.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'}).toUpperCase();
        clockElement.textContent = `${dateString} ${timeString}`;
      }
      updateClock(); setInterval(updateClock,1000);

      function getWeatherIcon(iconCode) {
        switch (iconCode) {
          case '01d': return '<i class="fas fa-sun"></i>';
          case '01n': return '<i class="fas fa-moon"></i>';
          case '02d': case '03d': case '04d': return '<i class="fas fa-cloud-sun"></i>';
          case '02n': case '03n': case '04n': return '<i class="fas fa-cloud-moon"></i>';
          case '09d': case '09n': case '10d': case '10n': return '<i class="fas fa-cloud-showers-heavy"></i>';
          case '11d': case '11n': return '<i class="fas fa-bolt"></i>';
          case '13d': case '13n': return '<i class="fas fa-snowflake"></i>';
          case '50d': case '50n': return '<i class="fas fa-smog"></i>';
          default: return '<i class="fas fa-cloud"></i>';
        }
      }
      
      function updateWeatherUI(data) {
        const temp = Math.round(data.main.temp);
        const description = data.weather[0].description;
        const iconCode = data.weather[0].icon;
        const locationName = data.name;
        weatherIcon.innerHTML = getWeatherIcon(iconCode);
        weatherTemp.textContent = `${temp}°`;
        weatherDisplay.title = `${locationName}: ${description}`;
      }
      
      function showWeatherError() {
        weatherTemp.textContent = 'N/A';
        weatherDisplay.title = 'Could not load weather data';
      }

      async function fetchWeatherByCoords(lat, lon) {
        const apiUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=${UNITS}&appid=${OPENWEATHER_API_KEY}`;
        try {
          const response = await fetch(apiUrl);
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          const data = await response.json();
          updateWeatherUI(data);
        } catch (error) {
          console.error("Failed to fetch weather by coordinates:", error);
          showWeatherError();
        }
      }

      async function fetchWeatherByCity(city) {
        const apiUrl = `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=${UNITS}&appid=${OPENWEATHER_API_KEY}`;
        try {
          const response = await fetch(apiUrl);
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          const data = await response.json();
          updateWeatherUI(data);
        } catch (error) {
          console.error("Failed to fetch weather by city:", error);
          showWeatherError();
        }
      }

      function getLocalWeather() {
        if (!OPENWEATHER_API_KEY || OPENWEATHER_API_KEY === 'YOUR_OPENWEATHERMAP_API_KEY') {
          console.error("API Key is missing or invalid.");
          showWeatherError();
          return;
        }
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => fetchWeatherByCoords(position.coords.latitude, position.coords.longitude),
            () => fetchWeatherByCity(FALLBACK_CITY)
          );
        } else {
          fetchWeatherByCity(FALLBACK_CITY);
        }
      }
      
      getLocalWeather();
      setInterval(getLocalWeather, HOURLY_INTERVAL);

      function updateInfoPanel(card){
        const { title, subheaderType, description, link, buttonText, status } = card.dataset;
        const subheaderIcon =
          (subheaderType === 'online')
            ? `<i class="fas fa-wifi icon wifi"></i> ONLINE ARCADE`
            : `<i class="fas fa-download icon download"></i> DOWNLOAD GAME`;
        const statusHTML = status ? `<p class="status-text">${status}</p>` : '';
        const buttonIcon = buttonText.includes('STEAM') ? `<i class="fab fa-steam"></i>` : '';
        infoPanel.innerHTML = `
          <h2 class="game-title">${title}</h2>
          <div class="game-subheader ${subheaderType}">${subheaderIcon}</div>
          <p class="game-description">${description}</p>
          ${statusHTML}
          <div class="play-button-container">
            <a href="${link}" class="play-button" ${link.includes('steam') ? 'target="_blank" rel="noreferrer"' : ''}>${buttonIcon}<span>${buttonText}</span></a>
          </div>`;
        channels.forEach(c => c.classList.remove('active'));
        card.classList.add('active');
      }

      const initialActive = document.querySelector('.channel-card.active');
      if(initialActive) updateInfoPanel(initialActive);

      channels.forEach(card => {
        card.addEventListener('mouseenter', () => updateInfoPanel(card));
        
        card.addEventListener('click', e => {
          e.preventDefault();
          const { link } = card.dataset;
          if (link && link !== '#') {
            if (link.includes('steam')) {
              window.open(link, '_blank', 'noopener,noreferrer');
            } else {
              window.location.href = link;
            }
          }
        });
      });
      
      infoPanel.addEventListener('click', e => {
        const playButton = e.target.closest('.play-button');
        if (playButton) {
          e.preventDefault();
          const link = playButton.href;
          if (link && link !== '#') {
            if (link.includes('steam')) {
              window.open(link, '_blank', 'noopener,noreferrer');
            } else {
              window.location.href = link;
            }
          }
        }
      });

      const isCrtOn = localStorage.getItem('crtEffect') === 'true';
      crtToggle.classList.toggle('active', isCrtOn);
      crtToggle.textContent = isCrtOn ? 'CRT ON' : 'CRT OFF';

      crtToggle.addEventListener('click', ()=>{
        const isNowActive = body.classList.toggle('crt-effect');
        crtToggle.classList.toggle('active', isNowActive);
        crtToggle.textContent = isNowActive ? 'CRT ON':'CRT OFF';
        localStorage.setItem('crtEffect', isNowActive);
      });

      applySavedPreferences();

      const noticeKey = 'mkxsphere_system_notice_v1';
      if(!localStorage.getItem(noticeKey)){
        setTimeout(()=> systemNotification.classList.add('show'), 3000);
        localStorage.setItem(noticeKey, 'seen');
      }
      closeNotification.addEventListener('click', ()=> systemNotification.classList.remove('show'));
    });
  </script>
</body>
</html>
