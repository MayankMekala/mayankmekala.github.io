<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MKX SOUND </title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous"
        referrerpolicy="no-referrer" />

  <style>
    :root {
      /* BACKGROUND + TEXT MATCH HOME (NOX BASE) */
      --bg-primary: radial-gradient(circle at top, #121220 0%, #050509 40%, #000000 100%);
      --text-primary: #e5e7eb;
      --text-secondary: #9ca3af;

      --accent-green: #a3e635;
      --accent-green-soft: rgba(163,230,53,0.3);

      --border-subtle: rgba(148,163,184,0.45);

      --panel-bg-dark: linear-gradient(135deg, rgba(15,23,42,0.98), #020617);
      --panel-bg-light: linear-gradient(135deg, #ffffff, #e5e7eb);

      --pill-bg-dark: rgba(10,16,30,0.96);
      --pill-bg-light: rgba(255,255,255,0.9);

      --panel-bg: var(--panel-bg-dark);
      --pill-bg: var(--pill-bg-dark);

      --radius-lg: 22px;
      --transition-fast: 0.25s ease-out;
    }

    body.light-mode {
      /* LUX BACKGROUND COPIED FROM HOME */
      --bg-primary:
        radial-gradient(
          circle at 30% 0%,
          rgba(255,255,255,1) 0%,
          rgba(245,248,255,0.95) 35%,
          rgba(230,235,255,0.90) 70%,
          rgba(210,220,245,0.85) 100%
        ),
        linear-gradient(
          135deg,
          rgba(255,255,255,0.85),
          rgba(230,235,250,0.90)
        );
      --text-primary: #000000;
      --text-secondary: #555555;
      --panel-bg: var(--panel-bg-light);
      --pill-bg: var(--pill-bg-light);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI",
        system-ui, sans-serif;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .sound-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.4rem 2.1rem 2.4rem;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      isolation: isolate;
    }

    @media (max-width: 960px) {
      .sound-shell {
        padding: 1.1rem 1.2rem 2rem;
      }
    }

    /* HEADER */

    .sound-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.8rem;
      gap: 1rem;
    }

    .sound-header-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      text-align: center;
    }

    .back-pill {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.7);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(15,23,42,0.96);
      color: var(--text-primary);
      cursor: pointer;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease,
        border-color 0.2s ease;
    }

    body.light-mode .back-pill {
      background: #ffffff;
      border-color: rgba(0,0,0,0.12);
      color: #020617;
      box-shadow: 0 8px 22px rgba(15,23,42,0.15);
    }
    body.light-mode .mode-pill {
  background: var(--pill-bg);
  color: #020617;           /* ← LUX text: dark */
}


    .back-pill:hover {
      transform: translateX(-2px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.65);
      border-color: var(--accent-green);
    }

    /* HEADER SOUND LOGO – BIGGER */
    .sound-logo {
      height: 110px;
      max-width: 320px;
      object-fit: contain;
      display: block;
    }

    .sound-header-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 120px;
    }

 .mode-pill {
  padding: 0.3rem 0.9rem;
  border-radius: 999px;
  border: 1px solid var(--border-subtle);
  background: var(--pill-bg);
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.62rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  cursor: pointer;
  color: #f9fafb;           /* ← NOX text: white */
}

    .mode-pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 0 4px var(--accent-green-soft);
    }

    @media (max-width: 900px) {
      .sound-header {
        flex-direction: row;
        align-items: center;
      }
    }

    @media (max-width: 640px) {
      .sound-header {
        gap: 0.6rem;
      }
      .sound-header-right {
        min-width: auto;
      }
    }

    /* MAIN */

    .sound-main {
      display: flex;
      flex-direction: column;
      gap: 2.1rem;
    }

    /* RACK LAYOUT */

    .rack {
      padding-top: 1.2rem;
      /* no border-top line */
    }

    .rack-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.2rem;
    }

    .rack-heading {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    /* rack-logo removed from markup; CSS kept in case you reintroduce it elsewhere */
    .rack-logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
    }

    .rack-text {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .rack-title {
      font-size: 0.92rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      white-space: nowrap;
    }

    .rack-description {
      font-size: 0.7rem;
      opacity: 0.8;
      max-width: 420px;
    }

    .thumb-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.1rem;
      margin-bottom: 0.4rem;
    }

    @media (max-width: 1100px) {
      .thumb-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .thumb-row {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .thumb-card {
      position: relative;
      border-radius: var(--radius-lg);
      padding: 4px;
      background: radial-gradient(circle at 0 0,
                    rgba(148,163,184,0.25),
                    transparent 60%);
      border: 1px solid rgba(148,163,184,0.6);
      overflow: hidden;
      cursor: pointer;
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease;
    }

    body.light-mode .thumb-card {
      background: radial-gradient(circle at 0 0,
          rgba(148,163,184,0.18),
          rgba(255,255,255,1) 45%);
      border-color: rgba(15,23,42,0.16);
    }

    .thumb-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 42px rgba(0,0,0,0.9);
      border-color: rgba(248,250,252,0.9);
      background: radial-gradient(circle at 0 0,
        rgba(148,163,184,0.3),
        rgba(15,23,42,1) 60%);
    }

    body.light-mode .thumb-card:hover {
      box-shadow: 0 20px 48px rgba(15,23,42,0.3);
      border-color: rgba(15,23,42,0.35);
      background: radial-gradient(circle at 0 0,
        rgba(255,255,255,1),
        rgba(229,231,235,1) 60%);
    }

    .thumb-media {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 18px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* COMING SOON BLOCK */

    .sound-coming-soon {
      margin-top: 1.6rem;
      display: flex;
      justify-content: center;
      text-align: center;
    }

    .sound-coming-inner {
      max-width: 520px;
    }

    .sound-coming-inner .soon-main {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }

    .sound-coming-inner .soon-sub {
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    /* MUSIC VIDEO MODAL */

    .mv-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .mv-modal.open {
      display: flex;
    }

    .mv-backdrop {
      position: absolute;
      inset: 0;
      /* match page background */
      background: var(--bg-primary);
      backdrop-filter: blur(18px);
    }

    body.light-mode .mv-backdrop {
      background: var(--bg-primary);
      backdrop-filter: blur(18px);
    }

    .mv-panel {
      position: relative;
      z-index: 1;
      width: min(980px, 94vw);
      max-height: min(580px, 90vh);
      background: var(--panel-bg);
      border-radius: 24px;
      border: 1px solid rgba(148,163,184,0.8);
      box-shadow: 0 30px 80px rgba(0,0,0,0.9);
      padding: 1.4rem 1.4rem 1.2rem;
      display: flex;
      flex-direction: column;
    }

    body.light-mode .mv-panel {
      box-shadow: 0 32px 80px rgba(15,23,42,0.35);
    }

    .mv-close {
      position: absolute;
      top: 0.85rem;
      right: 1rem;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.75);
      background: rgba(15,23,42,0.95);
      color: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      transition:
        background 0.18s ease,
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    body.light-mode .mv-close {
      background: #020617;
      color: #f9fafb;
      box-shadow: 0 10px 26px rgba(15,23,42,0.3);
    }

    .mv-close:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 26px rgba(0,0,0,0.8);
    }

    .mv-inner {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.2fr);
      gap: 1.2rem;
      margin-top: 0.4rem;
      flex: 1;
      min-height: 0;
    }

    @media (max-width: 900px) {
      .mv-inner {
        grid-template-columns: minmax(0, 1fr);
      }
      .mv-panel {
        padding: 1.2rem 1.1rem 1rem;
      }
    }

    .mv-main {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      text-align: left;
      justify-content: center;
    }

    .mv-section-pill {
      align-self: flex-start;
      padding: 0.22rem 0.9rem;
      border-radius: 999px;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #ffffff;
      background: linear-gradient(135deg, #9F0086, #FF0054); /* SOUND pill gradient */
    }

    .mv-tagline {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.85;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.25rem;
    }

    .mv-tagline-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 12px rgba(22,163,74,0.9);
    }

    .mv-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .mv-subline {
      font-size: 0.8rem;
      opacity: 0.85;
    }

    .mv-tech-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.3rem;
    }

    .mv-chip {
      font-size: 0.7rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.8);
      background: rgba(15,23,42,0.95);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
      color: #e5e7eb;
    }

    body.light-mode .mv-chip {
      background: rgba(15,23,42,0.96);
      color: #f9fafb;
      border-color: rgba(15,23,42,0.7);
    }

    .mv-chip i {
      font-size: 0.8rem;
    }

    .mv-credits {
      font-size: 0.78rem;
      margin-top: 0.6rem;
      line-height: 1.5;
    }

    .mv-links-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.8rem;
      flex-wrap: wrap;
    }

    .mv-play-btn {
      border-radius: 999px;
      border: none;
      padding: 0.52rem 0.98rem;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      background: linear-gradient(135deg, #ef4444, #f97316);
      color: #f9fafb;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(248,113,113,0.85);
    }

    .mv-play-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 40px rgba(248,113,113,1);
    }

    .mv-play-btn i {
      font-size: 0.9rem;
    }

    .mv-icons {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-left: 0.3rem;
    }

    .mv-icons a {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.8);
      background: rgba(15,23,42,0.98);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition:
        background 0.18s ease,
        border-color 0.18s ease,
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    .mv-icons a:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.9);
      border-color: #22c55e;
    }

    .mv-icons .fa-spotify { color: #1db954; }
    .mv-icons .fa-apple { color: #f9fafb; }
    .mv-icons .fa-soundcloud { color: #ff8800; }

    .mv-aside {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mv-poster-frame {
      width: 100%;
      max-width: 430px;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      border: 1px solid rgba(148,163,184,0.85);
      background: #000;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mv-poster-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }
  </style>
</head>
<body id="body">
  <div class="sound-shell">
    <header class="sound-header">
      <a href="home.html" class="back-pill" aria-label="Back to home">
        <i class="fas fa-chevron-left"></i>
      </a>

      <div class="sound-header-center">
        <!-- ONLY THE LOGO, BIGGER NOW -->
        <img src="logopack/3.png" alt="MKX Sound logo" class="sound-logo" />
      </div>

      <div class="sound-header-right">
        <button class="mode-pill" id="modePill" type="button">
          <span class="mode-pill-dot"></span>
          <span id="modePillLabel">NOX MODE</span>
        </button>
      </div>
    </header>

    <main class="sound-main">
      <!-- MUSIC VIDEOS SECTION -->
      <section class="rack" aria-label="MKX Sound music videos">
        <div class="rack-header">
          <div class="rack-heading">
            <!-- rack logo removed; just text -->
            <div class="rack-text">
              <h2 class="rack-title">Sound</h2>
              <p class="rack-description">Original music videos.</p>
            </div>
          </div>
        </div>

        <div class="thumb-row">
          <!-- Nostalgia Edition -->
          <div class="thumb-card"
               data-mv-card
               data-title="yung hallow – YUNG HONEYMOON (Nostalgia Edition)"
               data-artist="Yung Hallow"
               data-youtube="https://youtu.be/xKKTBC97Kmw?si=yTqtiOOadv7iMaxQ"
               data-camera="Sony FX30"
               data-edited="Edited and Graded in DaVinci Resolve"

               data-camera="Sony FX30"
               data-edited="Edited and Graded in DaVinci Resolve"
               data-poster="videothumbs/yunghoneymoonr.jpg"
               data-apple="https://music.apple.com/us/album/yung-honeymoon-single/1848588857"
               data-soundcloud="https://on.soundcloud.com/hYDXhbx5LHoiweT6UB"
               data-spotify="https://open.spotify.com/track/6NzrnAtq5dwpm8ytClOeb9?si=7ee3584e5c99451d"
               data-mixer="Vianey"
               data-producer="BXXXY"
               data-director="Mayank Mekala">
            <div class="thumb-media" style="background-image:url('videothumbs/yunghoneymoonr.jpg');"></div>
          </div>

          <!-- GOD IS LOVE -->
          <div class="thumb-card"
               data-mv-card
               data-title="yung hallow – GOD IS LOVE"
               data-artist="Yung Hallow"

            <div class="thumb-media" style="background-image:url('videothumbs/godislove.jpg');"></div>
          </div>
        </div>
      </section>

      <!-- COMING SOON TEXT -->
      <section class="sound-coming-soon">
        <div class="sound-coming-inner">
          <p class="soon-main">COMING SOON.</p>
          <p class="soon-sub">ORIGINAL MUSIC, AMBIENT RADIO AND MORE MUSIC VIDEOS</p>
        </div>
      </section>
    </main>
  </div>

  <!-- MUSIC VIDEO MODAL -->
  <div class="mv-modal" id="mvModal" aria-hidden="true">
    <div class="mv-backdrop"></div>
    <section class="mv-panel" role="dialog" aria-modal="true" aria-labelledby="mvTitle">
      <button class="mv-close" id="mvClose" aria-label="Close panel">
        <i class="fas fa-xmark"></i>
      </button>
      <div class="mv-inner">
        <div class="mv-main">
          <div class="mv-section-pill">MKX SOUND</div>

          <div class="mv-tagline">
            <span class="mv-tagline-dot"></span>
            <span id="mvTaglineMain">MKX MUSIC VIDEO</span>
          </div>
          <h1 class="mv-title" id="mvTitle">Title</h1>
          <p class="mv-subline" id="mvSubline">Original visual single</p>

          <div class="mv-tech-row" id="mvTechRow">
            <!-- camera + editing chips injected here -->
          </div>

          <div class="mv-credits" id="mvCredits">
            <!-- credits injected here -->
          </div>

          <div class="mv-links-row">
            <button class="mv-play-btn" id="mvPlayBtn">
              <i class="fab fa-youtube"></i>
              <span>Play on YouTube</span>
            </button>
            <div class="mv-icons">
              <a href="#" id="mvApple" target="_blank" rel="noopener" aria-label="Apple Music">
                <i class="fab fa-apple"></i>
              </a>
              <a href="#" id="mvSpotify" target="_blank" rel="noopener" aria-label="Spotify">
                <i class="fab fa-spotify"></i>
              </a>
              <a href="#" id="mvSoundcloud" target="_blank" rel="noopener" aria-label="SoundCloud">
                <i class="fab fa-soundcloud"></i>
              </a>
            </div>
          </div>
        </div>
        <aside class="mv-aside">
          <div class="mv-poster-frame">
            <img src="" alt="" id="mvPoster">
          </div>
        </aside>
      </div>
    </section>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const body = document.getElementById('body');
      const modePill = document.getElementById('modePill');
      const modePillLabel = document.getElementById('modePillLabel');

      function applyInitialMode() {
        const raw = (localStorage.getItem('mode') || localStorage.getItem('mkx_mode') || '').toLowerCase();
        if (raw === 'light' || raw === 'lux') {
          body.classList.add('light-mode');
          modePillLabel.textContent = 'LUX MODE';
        } else {
          body.classList.remove('light-mode');
          modePillLabel.textContent = 'NOX MODE';
        }
      }

      function toggleMode() {
        const isLight = !body.classList.contains('light-mode');
        if (isLight) {
          body.classList.add('light-mode');
          localStorage.setItem('mode', 'light');
          localStorage.setItem('mkx_mode', 'lux');
          modePillLabel.textContent = 'LUX MODE';
        } else {
          body.classList.remove('light-mode');
          localStorage.setItem('mode', 'dark');
          localStorage.setItem('mkx_mode', 'nox');
          modePillLabel.textContent = 'NOX MODE';
        }
      }

      applyInitialMode();
      if (modePill) {
        modePill.addEventListener('click', toggleMode);
      }

      /* MUSIC VIDEO MODAL */

      const mvModal = document.getElementById('mvModal');
      const mvClose = document.getElementById('mvClose');
      const mvTitle = document.getElementById('mvTitle');
      const mvSubline = document.getElementById('mvSubline');
      const mvTechRow = document.getElementById('mvTechRow');
      const mvCredits = document.getElementById('mvCredits');
      const mvPoster = document.getElementById('mvPoster');
      const mvPlayBtn = document.getElementById('mvPlayBtn');
      const mvApple = document.getElementById('mvApple');
      const mvSpotify = document.getElementById('mvSpotify');
      const mvSoundcloud = document.getElementById('mvSoundcloud');

      let currentYoutube = '#';

      function openMvModal(card) {
        if (!card) return;

        const title = card.dataset.title || 'Title';
        const artist = card.dataset.artist || '';
        const camera = card.dataset.camera || 'Sony FX30';
        const edited = card.dataset.edited || 'Edited and Graded in DaVinci Resolve';
        const mixer = card.dataset.mixer || '';
        const producer = card.dataset.producer || '';
        const director = card.dataset.director || 'Mayank Mekala';
        const poster = card.dataset.poster || '';
        const youtube = card.dataset.youtube || '#';
        const apple = card.dataset.apple || '';
        const spotify = card.dataset.spotify || '';
        const soundcloud = card.dataset.soundcloud || '';

        mvTitle.textContent = title;
        mvSubline.textContent = artist ? artist + ' · MKX SOUND' : 'MKX MUSIC VIDEO';

        mvTechRow.innerHTML = '';
        const camChip = document.createElement('span');
        camChip.className = 'mv-chip';
        camChip.innerHTML = '<i class="fa-solid fa-camera"></i><span>Camera: ' + camera + '</span>';
        mvTechRow.appendChild(camChip);

        const editChip = document.createElement('span');
        editChip.className = 'mv-chip';
        editChip.innerHTML = '<i class="fa-solid fa-scissors"></i><span>' + edited + '</span>';
        mvTechRow.appendChild(editChip);

        mvCredits.innerHTML =
          '<p>' +
          (artist ? 'Artist: ' + artist + '<br>' : '') +
          (mixer ? 'Mixer &amp; Engineer: ' + mixer + '<br>' : '') +
          (producer ? 'Producer: ' + producer + '<br>' : '') +
          'Director, Editor, DP, Colorist: ' + director +
          '</p>';

        mvPoster.src = poster || '';
        mvPoster.alt = title || 'Music video thumbnail';

        currentYoutube = youtube || '#';

        if (apple) {
          mvApple.style.display = 'inline-flex';
          mvApple.href = apple;
        } else {
          mvApple.style.display = 'none';
        }

        if (spotify) {
          mvSpotify.style.display = 'inline-flex';
          mvSpotify.href = spotify;
        } else {
          mvSpotify.style.display = 'none';
        }

        if (soundcloud) {
          mvSoundcloud.style.display = 'inline-flex';
          mvSoundcloud.href = soundcloud;
        } else {
          mvSoundcloud.style.display = 'none';
        }

        mvModal.classList.add('open');
        mvModal.setAttribute('aria-hidden', 'false');
      }

      function closeMvModal() {
        mvModal.classList.remove('open');
        mvModal.setAttribute('aria-hidden', 'true');
        currentYoutube = '#';
      }

      document.querySelectorAll('[data-mv-card]').forEach(function (card) {
        card.addEventListener('click', function () {
          openMvModal(card);
        });
      });

      if (mvClose) {
        mvClose.addEventListener('click', function () {
          closeMvModal();
        });
      }

      mvModal.addEventListener('click', function (e) {
        if (e.target === mvModal || e.target.classList.contains('mv-backdrop')) {
          closeMvModal();
        }
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && mvModal.classList.contains('open')) {
          closeMvModal();
        }
      });

      mvPlayBtn.addEventListener('click', function () {
        if (currentYoutube && currentYoutube !== '#') {
          window.open(currentYoutube, '_blank', 'noopener,noreferrer');
        }
      });
    });
  </script>
</body>
</html>
