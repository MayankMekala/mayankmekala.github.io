<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MKXSPHERE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    /* ---------------------------------------------------------------------- */
    /* --- BOOT OVERLAY (MKXSYSTEMS ANIMATION ON HOME) --- */
    /* ---------------------------------------------------------------------- */
    #bootOverlay{
      position:fixed; inset:0;
      background:#050505;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      z-index:999;
      color:#fff;
      font-family:"Helvetica", Arial, sans-serif;
      opacity:0; visibility:hidden; pointer-events:none;
    }
    #bootOverlay.boot-active{
      opacity:1; visibility:visible; pointer-events:auto;
      animation:bootFade 1s ease 3.6s forwards;
    }
    #bootOverlayLogo{ width:260px; opacity:0; }
    #bootOverlay.boot-active #bootOverlayLogo{ animation:bootLogoIntro 1.4s ease-out forwards; }

    .boot-status-wrap{ position:relative; margin-top:42px; height:18px; display:flex; align-items:center; justify-content:center; }
    #bootOverlayStatus{
      font-size:14px; letter-spacing:0.22em; text-transform:uppercase;
      color:#e5e5e5; opacity:0; position:absolute; left:50%;
      transform:translateX(-50%); white-space:nowrap;
    }
    #bootOverlay.boot-active #bootOverlayStatus{ animation:initFade 2.0s ease 0.6s forwards; }
    .boot-row{
      position:absolute; left:50%; transform:translateX(-50%);
      display:inline-flex; align-items:center; gap:8px;
      font-size:14px; letter-spacing:0.22em; text-transform:uppercase;
      color:#5dff5d; white-space:nowrap;
    }
    #bootOverlayIndicator{
      width:11px; height:11px; border-radius:999px;
      background:#46ff46; box-shadow:0 0 0 rgba(70,255,70,0);
      opacity:0;
    }
    #bootOverlayText{ opacity:0; transform:translateY(6px); }

    #bootOverlay.boot-active #bootOverlayIndicator{
      animation:indicatorIn 0.45s ease-out 1.9s forwards,
               indicatorPulse 1.2s ease-in-out 2.4s infinite;
    }
    #bootOverlay.boot-active #bootOverlayText{ animation:onlineIn 0.6s ease-out 2.2s forwards; }

    @keyframes bootLogoIntro{
      0%{opacity:0; transform:scale(0.9);}
      45%{opacity:1; transform:scale(1.03);}
      100%{opacity:1; transform:scale(1);}
    }
    @keyframes initFade{
      0%{opacity:0; transform:translateX(-50%) translateY(6px);}
      25%{opacity:1; transform:translateX(-50%) translateY(0);}
      70%{opacity:1; transform:translateX(-50%) translateY(0);}
      100%{opacity:0; transform:translateX(-50%) translateY(-4px);}
    }
    @keyframes indicatorIn{
      from{opacity:0; transform:scale(0.2); box-shadow:0 0 0 rgba(70,255,70,0);}
      to{opacity:1; transform:scale(1); box-shadow:0 0 14px rgba(70,255,70,0.9);}
    }
    @keyframes indicatorPulse{
      0%,100%{box-shadow:0 0 8px rgba(70,255,70,0.8);}
      50%{box-shadow:0 0 18px rgba(70,255,70,1);}
    }
    @keyframes onlineIn{
      0%{opacity:0; transform:translateY(6px); letter-spacing:0.28em;}
      100%{opacity:1; transform:translateY(0); letter-spacing:0.22em;}
    }
    @keyframes bootFade{ to{opacity:0; visibility:hidden;} }

    /* ---------------------------------------------------------------------- */
    /* --- MODE VARIABLES (LUX/NOX) --- */
    /* ---------------------------------------------------------------------- */
    :root{
      --bg-primary: radial-gradient(circle at top, #121220 0%, #050509 40%, #000000 100%);
      --text-primary:#fff;
      --text-secondary:#aaa;
      --link-hover:#ddd;
      --switch-icon-inactive:#aaa;
      --switch-bg:#555;
      --shadow-opacity:0.2;
    }
    body.light-mode{
      --bg-primary:
        radial-gradient(circle at 30% 0%,
          rgba(255,255,255,1) 0%,
          rgba(245,248,255,0.95) 35%,
          rgba(230,235,255,0.90) 70%,
          rgba(210,220,245,0.85) 100%
        ),
        linear-gradient(135deg, rgba(255,255,255,0.85), rgba(230,235,250,0.90));
      --text-primary:#000;
      --text-secondary:#555;
      --link-hover:#222;
      --switch-icon-inactive:#555;
      --switch-bg:#ccc;
      --shadow-opacity:0.1;
    }

    *{margin:0; padding:0; box-sizing:border-box;}
    body{
      background:var(--bg-primary);
      color:var(--text-primary);
      font-family:Helvetica, Arial, sans-serif;
      min-height:100vh;
      position:relative;
      transition:background 0.5s ease, color 0.5s ease;
      overflow-x:hidden;
      overflow-y:auto;
    }
    @supports (height:100dvh){ body{min-height:100dvh;} }

    @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
    @keyframes fadeInUp{ from{opacity:0;} to{opacity:1;} }

    @keyframes footerSlideUp{
      from{opacity:0; bottom:0rem;}
      to{opacity:1; bottom:1.3rem;}
    }

    /* ---------------------------------------------------------------------- */
    /* --- 3D ORBITAL ANIMATION (LOGOS) --- */
    /* ---------------------------------------------------------------------- */
    .logo-container{
      position:fixed; top:0; left:0;
      width:100%; height:100%;
      display:flex; justify-content:center; align-items:center;
      z-index:1; pointer-events:none;
      perspective:1200px;
    }
    .logo-animation{
      position:relative;
      width:1000px; height:1000px;
      display:flex; justify-content:center; align-items:center;
      opacity:0;
      animation:fadeIn 1.5s ease 0.5s forwards;
      transform-style:preserve-3d;
      max-width:120vw; max-height:120vh;
    }
    .prime-logo-wrapper{
      position:absolute;
      width:480px;
      z-index:5;
      transform:translateZ(0) translateY(-50px);
      transition:transform 0.5s ease;
      max-width:80vw;
    }
    .prime-logo-img{ width:100%; display:block; }

    .orbit-system{
      position:absolute;
      width:100%; height:100%;
      transform-style:preserve-3d;
      transform:rotateX(30deg);
    }

    /* orbiting logos larger */
    .orbit-logo{
      position:absolute;
      width:260px;
      pointer-events:auto;
      transform-style:preserve-3d;
      top:50%; left:50%;
      margin-top:-130px; margin-left:-130px;
      transform-origin:center center;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
      transition:transform 0.5s ease;
    }
    .orbit-logo img{
      width:100%;
      display:block;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
      transition:transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .orbit-logo:hover{ z-index:10; }
    .orbit-logo:hover img{ transform:scale(1.12); cursor:pointer; }

    /* make 6.png bigger than the others */
    .orbit-logo.logo-6{
      width:320px;
      margin-top:-160px;
      margin-left:-160px;
    }

    /* Only 3 orbiting logos now */
    .orbit-logo:nth-child(1){ animation:orbit3D 30s linear infinite; }
    .orbit-logo:nth-child(2){ animation:orbit3D 30s linear infinite; animation-delay:-10s; }
    .orbit-logo:nth-child(3){ animation:orbit3D 30s linear infinite; animation-delay:-20s; }

    @keyframes orbit3D{
      0%{transform:rotateY(0deg) translateX(520px) rotateY(0deg);}
      25%{transform:rotateY(90deg) translateX(520px) rotateY(-90deg);}
      50%{transform:rotateY(180deg) translateX(520px) rotateY(-180deg);}
      75%{transform:rotateY(270deg) translateX(520px) rotateY(-270deg);}
      100%{transform:rotateY(360deg) translateX(520px) rotateY(-360deg);}
    }

    /* ---------------------------------------------------------------------- */
    /* --- TOP CORNERS --- */
    /* ---------------------------------------------------------------------- */

    /* SOCIAL LINKS: UPPER RIGHT */
    .top-right-social{
      position:fixed;
      top: calc(1.3rem + env(safe-area-inset-top));
      right: calc(2rem + env(safe-area-inset-right));
      z-index:10;
      opacity:0;
      animation:fadeInUp 1.5s ease 1.2s forwards;
    }

    .social-pill{
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:0.6rem;
      font-size:1rem;
      padding:0.55rem 0.8rem;
      border-radius:999px;
      background: radial-gradient(circle at top, rgba(255,255,255,0.08), rgba(0,0,0,0.85));
      border:1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(14px);
    }
    body.light-mode .social-pill{
      background: radial-gradient(circle at top, rgba(0,0,0,0.03), rgba(255,255,255,0.88));
      border-color: rgba(0,0,0,0.08);
    }
    .social-pill a{
      color:var(--text-secondary);
      transition: all 0.25s ease;
      display:flex; align-items:center; justify-content:center;
      text-decoration:none;
    }
    .social-pill a:hover{ transform:scale(1.15); }
    .social-pill a.youtube:hover{ color:#ff0000; }
    .social-pill a.vimeo:hover{ color:#00f0ff; }
    .social-pill a.tiktok:hover{ color:#a855f7; }
    .social-pill a.instagram:hover{ color:#ff66ff; }
    .social-pill a.x-twitter:hover{ color:#00ff99; }

    /* dropups */
    .social-dropup{
      position:absolute;
      right:0;
      top: calc(100% + 10px);
      display:flex;
      align-items:center;
      gap:0.5rem;
      padding:0.45rem 0.7rem;
      border-radius:999px;
      background: radial-gradient(circle at top, rgba(255,255,255,0.10), rgba(0,0,0,0.9));
      border:1px solid rgba(255,255,255,0.3);
      backdrop-filter: blur(16px);
      opacity:0;
      transform: translateY(8px);
      pointer-events:none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      font-size:0.62rem;
      letter-spacing:0.16em;
      text-transform:uppercase;
      z-index:9;
      white-space:nowrap;
    }
    body.light-mode .social-dropup{
      background: radial-gradient(circle at top, rgba(255,255,255,0.96), rgba(235,240,255,0.96));
      border-color: rgba(0,0,0,0.08);
    }
    .social-dropup.open{
      opacity:1;
      transform: translateY(0);
      pointer-events:auto;
    }
    .social-dropup a{
      text-decoration:none;
      color:var(--text-secondary);
      padding:0.25rem 0.45rem;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.35);
      display:inline-flex;
      align-items:center;
      gap:0.3rem;
      font-weight:700;
    }
    body.light-mode .social-dropup a{
      background: rgba(255,255,255,0.85);
      border-color: rgba(0,0,0,0.06);
    }
    .social-dropup a span.handle{ opacity:0.7; }
    .social-dropup a:hover{ color:var(--link-hover); border-color: rgba(255,255,255,0.7); }
    .social-dropup.instagram-theme a:hover{ color:#ff66ff; border-color: rgba(255,102,255,0.85); }
    .social-dropup.x-theme a:hover{ color:#00ff99; border-color: rgba(0,255,153,0.7); }

    /* LUX/NOX SWITCH: UPPER LEFT */
    .mode-switch-container{
      position:fixed;
      top: calc(1.3rem + env(safe-area-inset-top));
      left: calc(2rem + env(safe-area-inset-left));
      z-index:10;
      display:inline-flex;
      align-items:center;
      gap:0.6rem;
      opacity:0;
      padding:0.55rem 0.8rem;
      border-radius:999px;
      background: radial-gradient(circle at top, rgba(255,255,255,0.08), rgba(0,0,0,0.85));
      border:1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(14px);
      animation:fadeInUp 1.5s ease 1.2s forwards;
    }
    body.light-mode .mode-switch-container{
      background: radial-gradient(circle at top, rgba(0,0,0,0.03), rgba(255,255,255,0.88));
      border-color: rgba(0,0,0,0.08);
    }
    .mode-switch-container .mode-icon{
      font-size:0.9rem;
      color:var(--switch-icon-inactive);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    body.light-mode .icon-lux{ color:#00c8ff; transform: translateY(-1px); }
    body:not(.light-mode) .icon-nox{ color:#ff66ff; transform: translateY(1px); }

    input[type="checkbox"]{ position:absolute; opacity:0; width:0; height:0; }
    .switch{ position:relative; display:inline-block; width:70px; height:24px; }
    .slider{
      position:absolute; cursor:pointer;
      inset:0;
      background-color: var(--switch-bg);
      transition:0.5s ease;
      border-radius:999px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
    }
    .slider:before{
      position:absolute;
      content:"";
      height:18px; width:34px;
      left:3px; top:3px;
      background: linear-gradient(135deg, #ff66ff, #00e6ff);
      transition:0.5s ease;
      border-radius:999px;
    }
    .mode-switch-container input:checked + .slider:before{
      transform: translateX(32px);
      background: linear-gradient(135deg, #00e6ff, #fff176);
    }

    /* ---------------------------------------------------------------------- */
    /* --- BOTTOM CORNERS --- */
    /* ---------------------------------------------------------------------- */

    /* ENGINEERED BY...: BOTTOM RIGHT */
    header{
      position:fixed;
      bottom: calc(1.3rem + env(safe-area-inset-bottom));
      right: calc(2rem + env(safe-area-inset-right));
      font-size:0.6rem;
      color:var(--text-secondary);
      letter-spacing:0.18em;
      z-index:10;
      font-weight:700;
      text-transform:uppercase;
      cursor:pointer;
      padding:0.5rem 0.9rem;
      border-radius:999px;
      background: linear-gradient(110deg, rgba(0,0,0,0.9), rgba(25,25,40,0.9));
      border:1px solid rgba(255,255,255,0.2);
      opacity:0;
      animation:footerSlideUp 0.9s ease 0.75s forwards;
      transition: transform 0.25s ease, color 0.25s ease;
      white-space:nowrap;
    }
    body.light-mode header{
      background: linear-gradient(110deg, rgba(255,255,255,0.95), rgba(235,235,250,0.95));
      border-color: rgba(0,0,0,0.1);
    }
    header::before{
      content:"v1.0";
      margin-right:0.5rem;
      font-weight:900;
      font-style:italic;
      color:rgba(0,255,255,0.8);
    }
    header:hover{ transform: translateY(-3px); color: var(--link-hover); }

    /* ALL SYSTEMS ONLINE: BOTTOM LEFT */
    .system-status{
      position:fixed;
      bottom: calc(1.3rem + env(safe-area-inset-bottom));
      left: calc(2rem + env(safe-area-inset-left));
      display:flex;
      align-items:center;
      gap:0.5rem;
      font-size:0.55rem;
      color:var(--text-secondary);
      letter-spacing:0.15em;
      z-index:10;
      font-weight:700;
      text-transform:uppercase;
      cursor:pointer;
      padding:0.4rem 0.9rem;
      border-radius:999px;
      background: radial-gradient(circle at top, rgba(0,0,0,0.9), rgba(0,0,0,0.6));
      border:1px solid rgba(0,255,0,0.5);
      opacity:0;
      animation:footerSlideUp 0.9s ease 0.6s forwards;
      transition: transform 0.25s ease;
      white-space:nowrap;
    }
    body.light-mode .system-status{
      background: radial-gradient(circle at top, rgba(255,255,255,0.95), rgba(220,255,220,0.95));
      border-color: rgba(0,160,0,0.5);
    }
    .system-status:hover{ transform: translateY(-3px); }
    .status-indicator{ width:8px; height:8px; border-radius:50%; background-color:#00ff00; }

    /* ---------------------------------------------------------------------- */
    /* --- MAIN MENU (BOTTOM CENTER) --- */
    /* ---------------------------------------------------------------------- */
    .bottom-nav{
      position:fixed;
      bottom: calc(1.3rem + env(safe-area-inset-bottom));
      left:50%;
      transform: translateX(-50%);
      display:flex;
      justify-content:center;
      align-items:center;
      gap:0.6rem;
      opacity:0;
      z-index:10;
      padding:0.7rem 1.1rem;
      border-radius:999px;
      background: radial-gradient(circle at top, rgba(255,255,255,0.08), rgba(0,0,0,0.85));
      border:1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(14px);
      max-width:650px;
      animation: footerSlideUp 0.9s ease 0.75s forwards;
    }
    body.light-mode .bottom-nav{
      background: radial-gradient(circle at top, rgba(0,0,0,0.03), rgba(255,255,255,0.88));
      border-color: rgba(0,0,0,0.08);
    }
    .bottom-nav a{
      position:relative;
      text-decoration:none;
      font-size:0.78rem;
      letter-spacing:0.16em;
      text-transform:uppercase;
      color:var(--text-secondary);
      transition: all 0.25s ease;
      padding:0.3rem 0.35rem 0.35rem 0.35rem;
      font-weight:700;
      font-style:italic;
      border-radius:6px;
      white-space:nowrap;
    }
    .bottom-nav a::after{
      content:"";
      position:absolute;
      left:15%; right:15%;
      bottom:0.3rem;
      height:1px;
      background: linear-gradient(to right, rgba(0,255,153,0), rgba(0,255,153,0.7), rgba(0,255,153,0));
      opacity:0.35;
      transform: scaleX(0.7);
      transform-origin:center;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .bottom-nav a:hover{
      transform:scale(1.03);
      color:#00ff99;
      background: rgba(0,255,153,0.08);
    }
    .bottom-nav a:hover::after{
      opacity:1;
      transform: scaleX(1);
    }

    /* ---------------------------------------------------------------------- */
    /* --- MKX LENS / X-RAY GLASS --- */
    /* ---------------------------------------------------------------------- */
    .mkx-lens{
      position:fixed;
      width:220px;
      height:220px;
      border-radius:50%;
      overflow:hidden;
      pointer-events:none;
      z-index:4;
      left:50%; top:50%;
      transform: translate(-50%, -50%);
      border:1px solid rgba(0,255,170,0.9);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.9), 0 0 40px rgba(0,255,170,0.35);
      opacity:0;
      transition: opacity 0.18s ease-out, box-shadow 0.18s ease-out;
      mix-blend-mode: screen;
    }
    body.light-mode .mkx-lens{
      border-color: rgba(0,160,120,0.9);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.9), 0 0 30px rgba(0,160,120,0.28);
      mix-blend-mode: multiply;
    }
    body.lens-active #mkxLens{ opacity:1; }
    .mkx-lens-inner{
      position:relative;
      width:100%; height:100%;
      background: radial-gradient(circle at center, rgba(0,255,170,0.18) 0, rgba(0,0,0,0.0) 55%);
    }
    .mkx-lens-grid{
      position:absolute; inset:-2px;
      background-image:
        repeating-linear-gradient(0deg, rgba(0,255,170,0.25) 0, rgba(0,255,170,0.25) 1px, transparent 1px, transparent 10px),
        repeating-linear-gradient(90deg, rgba(0,255,170,0.25) 0, rgba(0,255,170,0.25) 1px, transparent 1px, transparent 10px);
      opacity:0.8;
      mix-blend-mode: screen;
    }
    .mkx-lens-scan{
      position:absolute; inset:-20%;
      background-image:
        repeating-linear-gradient(180deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) 3px, rgba(0,255,170,0.14) 4px);
      mix-blend-mode: screen;
      opacity:0.6;
      animation: lensScan 3.5s linear infinite;
    }
    .mkx-lens-annotation{
      position:absolute;
      left:12px; bottom:14px;
      font-size:0.45rem;
      letter-spacing:0.16em;
      text-transform:uppercase;
      color: rgba(0,255,170,0.95);
      text-shadow: 0 0 4px rgba(0,0,0,0.9);
    }
    .mkx-lens-tag{
      position:absolute;
      right:10px; top:10px;
      font-size:0.48rem;
      letter-spacing:0.18em;
      text-transform:uppercase;
      color: rgba(0,255,170,0.8);
      padding:2px 6px;
      border-radius:999px;
      border:1px solid rgba(0,255,170,0.5);
      background: rgba(0,0,0,0.7);
    }
    .mkx-lens-crosshair{
      position:absolute;
      left:50%; top:50%;
      width:40px; height:40px;
      transform: translate(-50%, -50%);
      opacity:0.7;
    }
    .mkx-lens-crosshair::before,
    .mkx-lens-crosshair::after{
      content:"";
      position:absolute;
      background: rgba(0,255,170,0.8);
    }
    .mkx-lens-crosshair::before{ width:1px; height:100%; left:50%; top:0; transform: translateX(-50%); }
    .mkx-lens-crosshair::after{ height:1px; width:100%; top:50%; left:0; transform: translateY(-50%); }

    @keyframes lensScan{
      0%{transform: translateY(-12%);}
      50%{transform: translateY(12%);}
      100%{transform: translateY(-12%);}
    }

    /* ---------------------------------------------------------------------- */
    /* --- RESPONSIVE IMPROVEMENTS --- */
    /* ---------------------------------------------------------------------- */
    
    /* Prevent text size adjustment on mobile */
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    
    /* Small tablets and large phones (601px - 768px) */
    @media (max-width: 768px) {
      .logo-container {
        perspective: 800px;
      }
      
      .logo-animation {
        width: 750px;
        height: 750px;
        max-width: 110vw;
        max-height: 110vh;
      }
      
      .prime-logo-wrapper {
        width: 380px;
        transform: translateZ(0) translateY(-40px);
      }
      
      .orbit-logo {
        width: 220px;
        margin-top: -110px;
        margin-left: -110px;
      }
      
      .orbit-logo.logo-6 {
        width: 280px;
        margin-top: -140px;
        margin-left: -140px;
      }
      
      @keyframes orbit3D {
        0% { transform: rotateY(0deg) translateX(420px) rotateY(0deg); }
        25% { transform: rotateY(90deg) translateX(420px) rotateY(-90deg); }
        50% { transform: rotateY(180deg) translateX(420px) rotateY(-180deg); }
        75% { transform: rotateY(270deg) translateX(420px) rotateY(-270deg); }
        100% { transform: rotateY(360deg) translateX(420px) rotateY(-360deg); }
      }
    }
    
    /* Medium phones (481px - 600px) */
    @media (max-width: 600px) {
      .logo-animation {
        width: 650px;
        height: 650px;
      }
      
      .prime-logo-wrapper {
        width: 320px;
        transform: translateZ(0) translateY(-30px);
      }
      
      .orbit-logo {
        width: 190px;

      @keyframes orbit3D {

        25% { transform: rotateY(90deg) translateX(330px) rotateY(-90deg); }
        50% { transform: rotateY(180deg) translateX(330px) rotateY(-180deg); }
        75% { transform: rotateY(270deg) translateX(330px) rotateY(-270deg); }
        100% { transform: rotateY(360deg) translateX(330px) rotateY(-360deg); }
      }
      
      /* Adjust UI elements for better mobile spacing */
      .top-right-social {
        top: calc(0.8rem + env(safe-area-inset-top));

      }
      
      .mode-switch-container {
        top: calc(0.8rem + env(safe-area-inset-top));

    /* Small phones (max-width: 480px) */

        50% { transform: rotateY(180deg) translateX(280px) rotateY(-180deg); }

        50% { transform: rotateY(180deg) translateX(240px) rotateY(-180deg); }
        75% { transform: rotateY(270deg) translateX(240px) rotateY(-270deg); }
        100% { transform: rotateY(360deg) translateX(240px) rotateY(-360deg); }

      /* Hide some non-essential elements on very small screens */

    /* Landscape orientation adjustments */
    @media (max-height: 500px) and (orientation: landscape) {
      .logo-container {
        transform: scale(0.8);
        transform-origin: center;
      }
      
      .prime-logo-wrapper {
        transform: translateZ(0) translateY(-80px) !important;
      }
      
      .top-right-social,

      }

      header,
      .bottom-nav {

      }
      
      .bottom-nav {
        padding: 0.4rem 0.8rem;
      }
      
      .bottom-nav a {
        font-size: 0.65rem;
      }
    }
    
    /* Improve touch targets for mobile */
    @media (hover: none) and (pointer: coarse) {
      .orbit-logo img,
      .bottom-nav a,
      .social-pill a,
      .social-dropup a {
        min-height: 44px;
        min-width: 44px;

      }
      
      .mode-switch-container input:checked + .slider:before {

      }
    }
    
    /* Smooth mobile interactions */
    @media (hover: none) {
      .orbit-logo:hover img {

      }
      
      .bottom-nav a:hover {
        transform: none;
        background: transparent;
      }

      /* Mobile tap active states */

      }
      
      .bottom-nav a:active {
        transform: scale(0.95) !important;
        background: rgba(0, 255, 153, 0.15);
      }
      
      .social-pill a:active {
        transform: scale(0.95) !important;
      }
    }
  </style>
</head>

<body id="body" class="light-mode">

<script>
  const body = document.getElementById('body');
  const modeToggle = document.getElementById('modeToggle');
  const systemStatus = document.getElementById('systemStatus');
  const siteHeader = document.getElementById('siteHeader');
  const lightModeClass = 'light-mode';
  const bootOverlay = document.getElementById('bootOverlay');
  const mkxLens = document.getElementById('mkxLens');

  function updateLogos() {
    const logoImages = document.querySelectorAll('.prime-logo-img, .orbit-logo img');
    const isLightMode = body.classList.contains(lightModeClass);

    logoImages.forEach(img => {
      const darkSrc = img.getAttribute('data-default-src');
      const lightSrc = img.getAttribute('data-light-src') || darkSrc;
      img.src = isLightMode ? lightSrc : darkSrc;
    });
  }

  function preloadLogos() {
    const logoImages = document.querySelectorAll('.prime-logo-img, .orbit-logo img');
    const logoUrls = new Set();

    logoImages.forEach(img => {
      const darkSrc = img.getAttribute('data-default-src');
      const lightSrc = img.getAttribute('data-light-src');
      if (darkSrc) logoUrls.add(darkSrc);
      if (lightSrc) logoUrls.add(lightSrc);
    });

    logoUrls.forEach(url => {
      const i = new Image();
      i.src = url;
    });
  }

  function setMode(isLight) {
    if (isLight) {
      body.classList.add(lightModeClass);
      localStorage.setItem('mode', 'light');
    } else {
      body.classList.remove(lightModeClass);
      localStorage.setItem('mode', 'dark');
    }
    if (modeToggle) modeToggle.checked = isLight;
    updateLogos();
  }

  function applyModePreference() {
    const savedMode = localStorage.getItem('mode');
    if (savedMode === 'light' || savedMode === 'dark') {
      setMode(savedMode === 'light');
    } else {
      setMode(true);
    }
  }

  preloadLogos();
  applyModePreference();

  if (modeToggle) {
    modeToggle.addEventListener('change', function() {
      setMode(this.checked);
    });
  }

  // PLAY BOOT OVERLAY
  function playBootOverlay() {
    if (!bootOverlay) return;
    bootOverlay.classList.remove('boot-active');
    void bootOverlay.offsetWidth;
    bootOverlay.classList.add('boot-active');
  }

  if (systemStatus) {
    systemStatus.addEventListener('click', () => playBootOverlay());
  }

  // Header goes to info.html
  if (siteHeader) {
    siteHeader.addEventListener('click', () => {
      window.location.href = 'info.html';
    });
  }

  // SOCIAL DROPUPS
  const instaTrigger = document.getElementById('instaTrigger');
  const xTrigger     = document.getElementById('xTrigger');
  const instaDropup  = document.getElementById('instaDropup');
  const xDropup      = document.getElementById('xDropup');
  const socialPill   = document.getElementById('socialPill');

  function closeAllDropups() {
    if (instaDropup) instaDropup.classList.remove('open');
    if (xDropup) xDropup.classList.remove('open');
  }

  if (instaTrigger && instaDropup) {
    instaTrigger.addEventListener('click', (e) => {
      e.preventDefault();
      const isOpen = instaDropup.classList.contains('open');
      closeAllDropups();
      if (!isOpen) instaDropup.classList.add('open');
    });
  }

  if (xTrigger && xDropup) {
    xTrigger.addEventListener('click', (e) => {
      e.preventDefault();
      const isOpen = xDropup.classList.contains('open');
      closeAllDropups();
      if (!isOpen) xDropup.classList.add('open');
    });
  }

  document.addEventListener('click', (e) => {
    if (!socialPill) return;
    if (!socialPill.contains(e.target)) closeAllDropups();
  });

  // MKX LENS
  document.addEventListener('mousemove', (e) => {
    if (!mkxLens) return;
    if (!document.body.classList.contains('lens-active')) return;
    mkxLens.style.left = e.clientX + 'px';
    mkxLens.style.top  = e.clientY + 'px';
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'x' || e.key === 'X') {
      document.body.classList.toggle('lens-active');
    }
  });

  // MOBILE ENHANCEMENTS
  
  // Prevent zoom on double-tap for iOS
  let lastTouchEnd = 0;
  document.addEventListener('touchend', function(event) {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });

  // Prevent pull-to-refresh on mobile
  document.body.style.overscrollBehaviorY = 'none';

  // Better handling for social dropups on mobile
  document.addEventListener('DOMContentLoaded', function() {
    const instaTrigger = document.getElementById('instaTrigger');
    const xTrigger = document.getElementById('xTrigger');
    
    if (window.matchMedia("(hover: none) and (pointer: coarse)").matches) {
      // Mobile device detected
      if (instaTrigger) {
        instaTrigger.addEventListener('touchstart', function(e) {
          e.preventDefault();
          const instaDropup = document.getElementById('instaDropup');
          const isOpen = instaDropup.classList.contains('open');
          closeAllDropups();
          if (!isOpen) instaDropup.classList.add('open');
        });
      }
      
      if (xTrigger) {
        xTrigger.addEventListener('touchstart', function(e) {
          e.preventDefault();
          const xDropup = document.getElementById('xDropup');
          const isOpen = xDropup.classList.contains('open');
          closeAllDropups();
          if (!isOpen) xDropup.classList.add('open');
        });
      }
      
      // Close dropups when tapping outside
      document.addEventListener('touchstart', function(e) {
        const socialPill = document.getElementById('socialPill');
        if (!socialPill.contains(e.target)) {
          closeAllDropups();
        }
      });
    }
  });

  // Handle orientation change
  window.addEventListener('orientationchange', function() {
    // Add a small delay to allow CSS to update
    setTimeout(function() {
      if (window.innerHeight > window.innerWidth) {
        // Portrait mode
        document.body.classList.remove('landscape');
      } else {
        // Landscape mode
        document.body.classList.add('landscape');
      }
    }, 100);
  });

  // Mobile-specific MKX lens handling
  if (window.matchMedia("(max-width: 768px)").matches) {
    // Hide lens by default on mobile for performance
    const mkxLens = document.getElementById('mkxLens');
    if (mkxLens) {
      mkxLens.style.display = 'none';
    }
    
    // Enable lens with triple tap on mobile (instead of X key)
    let tapCount = 0;
    let lastTap = 0;
    
    document.addEventListener('touchstart', function(e) {
      const currentTime = Date.now();
      const tapLength = currentTime - lastTap;
      
      if (tapLength < 300 && tapLength > 0) {
        tapCount++;
      } else {
        tapCount = 1;
      }
      
      lastTap = currentTime;
      
      if (tapCount === 3) {
        e.preventDefault();
        const mkxLens = document.getElementById('mkxLens');
        if (mkxLens) {
          mkxLens.style.display = mkxLens.style.display === 'none' ? 'block' : 'none';
          document.body.classList.toggle('lens-active');
        }
        tapCount = 0;
      }
    });
  }

  // Improve mobile performance by reducing animation complexity on low-end devices
  if ('hardwareConcurrency' in navigator && navigator.hardwareConcurrency < 4) {
    // Reduce animation quality on low-end devices
    document.querySelectorAll('.orbit-logo').forEach(logo => {
      logo.style.willChange = 'transform';
    });
  }
</script>
