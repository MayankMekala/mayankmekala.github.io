<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MKX STORE </title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    :root {
      --bg-dark: radial-gradient(circle at top, #151629 0, #05050a 45%, #000 100%);
      --bg-light:
        radial-gradient(circle at 30% 0%, rgba(255,255,255,1) 0%, rgba(245,248,255,0.95) 35%, rgba(230,235,255,0.90) 70%, rgba(210,220,245,0.85) 100%),
        linear-gradient(135deg, rgba(255,255,255,0.85), rgba(230,235,250,0.90));
      --text-dark: #f5f5f5;
      --text-light: #101010;
      --accent: #9cf35d;
      --transition-fast: 0.25s ease-out;
      --transition-med: 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);

      --bg-primary: var(--bg-dark);
      --text-primary: var(--text-dark);
      --text-secondary: #aaa;
      --link-hover: #ddd;
      --shadow-opacity: 0.2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Space Grotesk", system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      padding: 24px 12px 40px;
      overflow-x: hidden;
      transition: background 0.5s ease, color 0.5s ease;
    }

    body.light-mode {
      --bg-primary: var(--bg-light);
      --text-primary: #000;
      --text-secondary: #555;
      --shadow-opacity: 0.1;
      color: var(--text-primary);
    }

    /* HYPERSPACE BACKGROUND */
    .space-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    #spaceCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .page-frame {
      max-width: 1680px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 32px 40px;
      position: relative;
      z-index: 1;
      background: transparent;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }

    /* HEADER */
    .sound-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgba(0,0,0,0.4);
      color: inherit;
      transition: transform var(--transition-fast),
                  box-shadow var(--transition-fast),
                  border-color var(--transition-fast),
                  background var(--transition-fast);
    }

    .back-btn i { font-size: 14px; }

    .back-btn:hover {
      transform: translateX(-2px);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(156,243,93,0.5);
      background: rgba(2,6,23,0.9);
    }

    body.light-mode .back-btn {
      background: rgba(255,255,255,0.9);
      border-color: rgba(0,0,0,0.08);
    }

    body.light-mode .back-btn:hover {
      background: #111;
      color: #f4f4f4;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.3);
    }

    .header-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* CENTER AREA */
    .coming-wrapper {
      position: relative;
      min-height: calc(100vh - 160px);
    }

    .center-stack {
      position: absolute;
      top: 50%;
      left: 50%;
      /* moved even further up */
      transform: translate(-50%, -160%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
    }

    /* MAIN "COMING SOON" TEXT */
    .store-main-title {
      font-size: 28px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-style: italic;
      font-weight: 800;
      color: #000;
    }

    body:not(.light-mode) .store-main-title {
      color: #f9fafb;
    }

    @media (max-width: 860px) {
      .page-frame {
        padding: 18px 16px 34px;
      }
      .coming-wrapper {
        min-height: calc(100vh - 200px);
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 14px 10px 26px;
      }
      .sound-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .page-frame {
        padding-top: 16px;
      }
      .center-stack {
        transform: translate(-50%, -80%);
      }
    }
  </style>
</head>
<body id="body">
  <!-- HYPERSPACE / STARFIELD BACKGROUND -->
  <div class="space-layer">
    <canvas id="spaceCanvas"></canvas>
  </div>

  <div class="page-frame">
    <!-- HEADER -->
    <header class="sound-header">
      <div class="header-left">
        <button class="back-btn" onclick="window.location.href='home.html'">
          <i class="fas fa-chevron-left"></i>
        </button>
        <div class="header-text">
          <div class="header-title">Store</div>
        </div>
      </div>
    </header>

    <!-- CENTERED STACK -->
    <main class="coming-wrapper">
      <div class="center-stack">
        <h1 class="store-main-title">COMING SOON</h1>
      </div>
    </main>
  </div>

  <script>
    // Apply LUX / NOX from other pages via localStorage
    (function () {
      const body = document.getElementById('body');

      const rawMode =
        (localStorage.getItem('mode') ||
         localStorage.getItem('mkx_mode') ||
         '').toLowerCase();

      const isLux = rawMode === 'lux' || rawMode === 'light';

      if (isLux) {
        body.classList.add('light-mode');
      } else {
        body.classList.remove('light-mode');
      }
    })();

    // Hyperspace / Star Wars-style warp background
    (function () {
      const canvas = document.getElementById('spaceCanvas');
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      let width = 0;
      let height = 0;
      let centerX = 0;
      let centerY = 0;
      const dpr = window.devicePixelRatio || 1;

      const STAR_COUNT = 550;
      const stars = [];

      function readMode() {
        const raw =
          (localStorage.getItem('mode') ||
           localStorage.getItem('mkx_mode') ||
           '').toLowerCase();
        const isLux = raw === 'lux' || raw === 'light';
        return {
          isLux,
          fadeFill: isLux
            ? 'rgba(245,248,255,0.28)'
            : 'rgba(0,0,0,0.42)',
          starColor: isLux ? '#111111' : '#f9fafb'
        };
      }

      let modeState = readMode();

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        centerX = width / 2;
        centerY = height / 2;

        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function initStar(star) {
        const angle = Math.random() * Math.PI * 2;
        const radius = (Math.random() * 40) + 4;

        star.x = centerX + Math.cos(angle) * radius * (Math.random() * 0.6 + 0.4);
        star.y = centerY + Math.sin(angle) * radius * (Math.random() * 0.6 + 0.4);
        star.vx = Math.cos(angle);
        star.vy = Math.sin(angle);

        star.speed = 1.1 + Math.random() * 2.4;
        star.size = 0.4 + Math.random() * 1.2;
      }

      function createStars() {
        stars.length = 0;
        for (let i = 0; i < STAR_COUNT; i++) {
          const s = {};
          initStar(s);
          stars.push(s);
        }
      }

      function step() {
        modeState = readMode();

        ctx.fillStyle = modeState.fadeFill;
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.strokeStyle = modeState.starColor;
        ctx.lineCap = 'round';

        for (let i = 0; i < stars.length; i++) {
          const star = stars[i];
          const prevX = star.x;
          const prevY = star.y;

          const velocityBoost = 1.5;
          star.x += star.vx * star.speed * velocityBoost;
          star.y += star.vy * star.speed * velocityBoost;

          ctx.beginPath();
          ctx.lineWidth = star.size;
          ctx.moveTo(prevX, prevY);
          ctx.lineTo(star.x, star.y);
          ctx.stroke();

          if (
            star.x < -100 || star.x > width + 100 ||
            star.y < -100 || star.y > height + 100
          ) {
            initStar(star);
          }
        }

        ctx.restore();
        window.requestAnimationFrame(step);
      }

      window.addEventListener('resize', () => {
        resize();
        createStars();
      });

      resize();
      createStars();
      step();
    })();
  </script>
</body>
</html>
