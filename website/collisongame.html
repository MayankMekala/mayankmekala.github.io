<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>COLLISION COURSE - MKXSPHERE</title>
<style>
  /* Base layout */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#030304;
    color:#fff;
    font-family: "Courier New", monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* Back button */
  .back-button {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 16px;
    border-radius: 4px;
    font-family: "Courier New", monospace;
    font-size: 14px;
    cursor: pointer;
    z-index: 100;
    transition: all 0.2s ease;
    text-decoration: none;
  }
  .back-button:hover {
    background: rgba(255,255,255,0.2);
    border-color: rgba(255,255,255,0.4);
  }

  .game-container{
    width:1200px;
    max-width:96vw;
    height:700px;
    background:linear-gradient(180deg,#050506,#08080a);
    border:1px solid rgba(255,255,255,0.05);
    border-radius:6px;
    overflow:hidden;
    position:relative;
    box-shadow: 0 18px 40px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.02);
  }

  /* main canvas */
  #gameCanvas{ display:block; width:100%; height:100%; background:transparent; }

  /* UI overlay (monochrome except glows) */
  .ui{
    position:absolute; inset:0; pointer-events:none; z-index:25;
  }
  .title{
    position:absolute; top:18px; left:50%; transform:translateX(-50%); font-size:18px; letter-spacing:3px; color:#fff; font-weight:700;
  }
  .score{ position:absolute; top:18px; left:18px; font-size:13px; color:#ddd; }
  .stars{ position:absolute; top:42px; left:18px; font-size:12px; color:#ddd; }
  .high{ position:absolute; top:18px; right:18px; font-size:13px; color:#ddd; }

  .energy-wrap{
    position:absolute; left:18px; bottom:18px; width:360px; pointer-events:none;
  }
  .energy-label{ font-size:11px; color:#d7d7d7; display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .energy-bar{
    width:100%; height:14px; background:rgba(255,255,255,0.04); border-radius:8px; overflow:hidden;
    box-shadow: inset 0 -4px 10px rgba(0,0,0,0.6);
  }
  .energy-fill{ width:0%; height:100%; background: linear-gradient(90deg,#ff3b3b,#ff0000); box-shadow: 0 0 14px rgba(255,40,40,0.85); transition:width 180ms linear; }

  .controls{
    position:absolute; bottom:18px; right:20px; font-size:12px; color:#cfcfcf; letter-spacing:0.6px;
  }

  /* Start screen (minimalist sci-fi) - FIXED LAYOUT */
  .start-screen{
    position:absolute; 
    inset:0; 
    z-index:60; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    pointer-events:auto;
    background: rgba(5,5,6,0.9);
    overflow: auto; /* Allow scrolling if needed */
    padding: 20px; /* Add padding to prevent content from touching edges */
  }
  
  .start-content {
    text-align: center;
    padding: 20px;
    max-width: 90%;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px; /* Maintain gap for overall spacing */
  }
  
  .title-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 0; /* Remove margin to bring subtitle closer */
  }
  
  .game-title {
    margin-bottom: 0; /* Remove bottom margin since we're using gap */
    display: flex;
    justify-content: center;
    max-height: 280px; /* Keep the large title size */
    width: 100%;
  }
  
  .game-title img {
    max-width: 100%;
    max-height: 100%;
    height: auto;
    filter: drop-shadow(0 0 10px rgba(110, 224, 255, 0.7));
    object-fit: contain; /* Ensure image fits within container */
  }
  
  .game-subtitle {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 16px;
    color: #aaa;
    margin: 0; /* Remove margin since we're using gap */
    letter-spacing: 1px;
    text-transform: none; /* Changed from uppercase */
    margin-top: -15px; /* Increased negative margin to pull subtitle much closer to title */
  }
  
  .game-copyright {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: #666;
    margin: 0; /* Remove margin since we're using gap */
    letter-spacing: 1px;
  }
  
  .start-btn {
    background: transparent;
    color: #fff;
    border: 1px solid rgba(110, 224, 255, 0.7);
    padding: 12px 30px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    margin: 0; /* Remove margin since we're using gap */
  }
  
  .start-btn:hover {
    background: rgba(110, 224, 255, 0.2);
    box-shadow: 0 0 15px rgba(110, 224, 255, 0.5);
  }
  
  /* Instructions section */
  .instructions {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin: 0; /* Remove margin since we're using gap */
    flex-wrap: wrap;
    max-width: 100%;
  }
  
  .instruction-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 150px;
  }
  
  .instruction-icon {
    width: 60px;
    height: 60px;
    border: 1px solid rgba(110, 224, 255, 0.5);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    font-size: 24px;
    color: rgba(110, 224, 255, 0.8);
  }
  
  .instruction-text {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: #aaa;
    text-align: center;
    line-height: 1.4;
  }

  /* blink cursor */
  .cursor{ display:inline-block; width:8px; height:14px; margin-left:6px; background:#fff; opacity:0; vertical-align:middle; animation:blink 1s steps(2) infinite; }
  @keyframes blink{ 0%{opacity:1}50%{opacity:0}100%{opacity:1} }

  /* Game Over modal */
  .game-over{ position:absolute; inset:0; display:none; z-index:80; align-items:center; justify-content:center; pointer-events:auto; background:rgba(0,0,0,0.6); }
  .go-card{ background:rgba(8,8,8,0.95); padding:18px; border-radius:6px; border:1px solid rgba(255,255,255,0.04); text-align:center; color:#fff }
  .go-btn{ margin-top:10px; padding:8px 12px; border-radius:6px; border:none; background:#fff; color:#000; cursor:pointer; font-weight:700; }

  /* Fade overlay for explosion -> fade-to-black */
  .fade{ position:absolute; inset:0; background:#000; opacity:0; z-index:70; pointer-events:none; transition:opacity 260ms linear; }

  /* paper grain overlay canvas placeholder */
  #grain{ position:absolute; inset:0; z-index:55; pointer-events:none; opacity:0.12; mix-blend-mode:overlay; }

  @media(max-width:960px){
    .game-container{ height:72vh }
    .instructions { gap: 20px; }
    .start-content {
      gap: 12px; /* Slightly reduced gap for tablet */
      padding: 15px;
    }
    .game-title {
      max-height: 200px; /* Adjusted for tablet */
    }
  }

  @media(max-width:600px){
    .start-content {
      gap: 10px; /* Slightly reduced gap for mobile */
      padding: 10px;
    }
    .game-title {
      max-height: 140px; /* Adjusted for mobile */
    }
    .instructions {
      gap: 15px;
    }
    .instruction-item {
      max-width: 120px;
    }
    .instruction-text {
      font-size: 11px;
    }
  }
</style>
</head>
<body>
  <a href="game.html" class="back-button">&lt;</a>

  <div class="game-container" id="gameContainer">
    <canvas id="gameCanvas" width="1200" height="700"></canvas>

    <div class="ui">
      <div class="title">COLLISION COURSE</div>
      <div class="score" id="scoreUI">SCORE: 0</div>
      <div class="stars" id="starsUI">STARS: 0</div>
      <div class="high" id="highUI">HIGH: 0</div>

      <div class="energy-wrap" aria-hidden="true">
        <div class="energy-label"><span>ENERGY</span><span id="energyText">0 / 20</span></div>
        <div class="energy-bar"><div id="energyFill" class="energy-fill"></div></div>
      </div>

      <div class="controls">USE W / S OR ↑ / ↓ • FIRE: SPACE / CLICK • COLLECT ORBS TO CHARGE</div>
    </div>

    <canvas id="grain" width="1200" height="700"></canvas>

    <div class="start-screen" id="startScreen">
      <div class="start-content">
        <div class="title-group">
          <div class="game-title">
            <img src="gamethumb/cctitle.png" alt="COLLISION COURSE">
          </div>
          <div class="game-subtitle">By Mayank Mekala</div>
        </div>
        
        <div class="instructions">
          <div class="instruction-item">
            <div class="instruction-icon">↑↓</div>
            <div class="instruction-text">MOVE UP & DOWN TO AVOID ASTEROIDS</div>
          </div>
          <div class="instruction-item">
            <div class="instruction-icon">⦿</div>
            <div class="instruction-text">COLLECT ORBS TO CHARGE YOUR WEAPON</div>
          </div>
          <div class="instruction-item">
            <div class="instruction-icon">⚡</div>
            <div class="instruction-text">FIRE LASERS TO DESTROY ASTEROIDS</div>
          </div>
        </div>
        
        <button id="startBtn" class="start-btn">LAUNCH MISSION</button>
        <div class="game-copyright">MKXGAME © 2025</div>
      </div>
    </div>

    <div class="fade" id="fadeOverlay"></div>

    <div class="game-over" id="gameOver">
      <div class="go-card">
        <h2 id="goTitle">MISSION FAILED</h2>
        <div id="goScore">SCORE: 0</div>
        <div id="goStars">STARS: 0</div>
        <div style="margin-top:10px"><button id="retryBtn" class="go-btn">RETRY</button></div>
      </div>
    </div>
  </div>

<script>
/* Full single-file implementation:
 - moving starfield background (white) drifting left
 - smaller more detailed ship (canvas polygon)
 - stronger glows (thruster, orbs, lasers)
 - collectible orbs = pulsing glowing spheres
 - explosion: big animated particle burst + screen flash + fade to black -> game over
 - energy & laser mechanics (20 shots max)
 - boot sequence once per page load, then start screen
 - paper grain overlay
 - retry returns to start screen (no boot) and resets properly
*/

(() => {
  // Canvas & contexts
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const grainCanvas = document.getElementById('grain');
  const gctx = grainCanvas.getContext('2d');

  // Logical sizes (larger canvas)
  const W = canvas.width = 1200;
  const H = canvas.height = 700;
  grainCanvas.width = W; grainCanvas.height = H;

  // DOM
  const startScreen = document.getElementById('startScreen');
  const startBtn = document.getElementById('startBtn');

  const scoreUI = document.getElementById('scoreUI');
  const starsUI = document.getElementById('starsUI');
  const highUI = document.getElementById('highUI');

  const energyFill = document.getElementById('energyFill');
  const energyText = document.getElementById('energyText');

  const fadeOverlay = document.getElementById('fadeOverlay');
  const gameOver = document.getElementById('gameOver');
  const retryBtn = document.getElementById('retryBtn');
  const goScore = document.getElementById('goScore');
  const goStars = document.getElementById('goStars');

  // Session boot played flag
  const BOOT_FLAG = 'cc_boot_v1';
  const bootPlayed = sessionStorage.getItem(BOOT_FLAG) === '1';

  // Game state variables
  let gameState = 'menu'; // menu, playing, dying, gameOver
  let score = 0;
  let stars = 0;
  let highScore = parseInt(localStorage.getItem('collisionCourseHighScore')||'0',10) || 0;
  highUI.textContent = 'HIGH: ' + highScore;
  let difficulty = 1;

  // Energy & laser
  const MAX_ENERGY = 20;
  let energy = 0; // start at 0
  const ENERGY_PER_ORB = 1;

  // Ship (smaller, more detailed)
  const ship = {
    x: 120,
    y: H/2,
    vx: 0,
    vy: 0,
    accel: 0.46,
    drag: 0.12,
    maxSpeed: 4.2,
    scale: 0.76
  };

  // Entities
  let starsBG = [];   // background small stars (white) moving left
  let asteroids = []; // irregular polygons
  let orbs = [];      // collectible glowing orbs
  let particles = []; // explosion & pickup particles
  let lasers = [];    // red laser bolts

  // timers
  let spawnTimer = 0;
  let orbTimer = 0;
  let last = performance.now();
  let dying = false;
  let fadeT = 0;

  // input
  const keys = {};

  // Paper grain generation once
  function drawGrain(){
    // generate random noise
    const img = gctx.createImageData(W, H);
    for(let i=0;i<img.data.length;i+=4){
      const v = 160 + Math.floor(Math.random()*95); // lighter grain
      img.data[i] = v;
      img.data[i+1] = v;
      img.data[i+2] = v;
      img.data[i+3] = 14; // low alpha for subtlety
    }
    gctx.putImageData(img, 0, 0);
    // slight vignette
    gctx.fillStyle = 'rgba(0,0,0,0.24)';
    gctx.beginPath();
    gctx.rect(0,0,W,H);
    gctx.fill();
    gctx.globalCompositeOperation = 'destination-out';
    const rad = Math.max(W,H)*0.6;
    const gx = gctx.createRadialGradient(W/2,H/2,rad*0.3,W/2,H/2,rad);
    gx.addColorStop(0,'rgba(0,0,0,0)');
    gx.addColorStop(1,'rgba(0,0,0,0.7)');
    gctx.fillStyle = gx;
    gctx.beginPath();
    gctx.arc(W/2,H/2,rad,0,Math.PI*2);
    gctx.fill();
    gctx.globalCompositeOperation = 'source-over';
  }
  drawGrain();

  // create moving background stars
  function initBackgroundStars(){
    starsBG = [];
    for(let i=0;i<140;i++){
      starsBG.push({
        x: Math.random()*W,
        y: Math.random()*H,
        size: Math.random()*2 + 0.4,
        speed: 0.2 + Math.random()*1.6,
        alpha: 0.12 + Math.random()*0.6
      });
    }
  }
  initBackgroundStars();

  // helpers
  function rand(min,max){ return Math.random()*(max-min)+min; }
  function irand(a,b){ return Math.floor(rand(a,b+1)); }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  // asteroid factory (irregular polygon)
  function createAsteroid(){
    const r = rand(18,48);
    const verts = irand(6,11);
    const pts = [];
    const jitter = rand(0.22,0.62);
    for(let i=0;i<verts;i++){
      const a = (i/verts)*Math.PI*2;
      const rr = r*(1 - jitter*Math.random());
      pts.push({x: Math.cos(a)*rr, y: Math.sin(a)*rr});
    }
    asteroids.push({
      x: W + r + 10,
      y: rand(r, H-r),
      vx: - (1.6 + Math.random()*2.2) - (score/6000),
      vy: rand(-0.25,0.25),
      ang: rand(0,Math.PI*2),
      rot: rand(-0.03,0.03),
      pts, radius: r
    });
  }

  // orb / collectible factory (glowing sphere)
  function createOrb(){
    const r = rand(6,11);
    orbs.push({
      x: W + r + 8,
      y: rand(r, H-r),
      vx: - (2.4 + Math.random()*1.8),
      r,
      pulse: Math.random()*Math.PI*2,
      pulseSpeed: rand(0.025,0.085)
    });
  }

  // particle generator
  function emit(x,y,color,count,spread,lifeRange){
    for(let i=0;i<count;i++){
      const ang = rand(0,Math.PI*2);
      const s = rand(0.6,spread);
      particles.push({
        x, y,
        vx: Math.cos(ang)*s + rand(-0.35,0.35),
        vy: Math.sin(ang)*s + rand(-0.35,0.35),
        life: irand(lifeRange[0], lifeRange[1]),
        maxLife: irand(lifeRange[0], lifeRange[1]),
        color
      });
    }
  }

  // explosion (big)
  function explosion(x,y){
    // strong flash
    emit(x,y,'#ffe9c6', 48, 5.2, [30,80]);
    emit(x,y,'#ffb36b', 28, 4.2, [22,60]);
    emit(x,y,'#ffd0d0', 20, 3.2, [18,40]);
    // camera shake placeholder (we can nudge draw origin)
    dying = true;
    fadeT = 0;
  }

  // firing laser
  function shoot(){
    if(energy <= 0 || gameState !== 'playing' || dying) return;
    lasers.push({
      x: ship.x + 28,
      y: ship.y,
      vx: 12 + Math.random()*2,
      len: 280
    });
    emit(ship.x+28, ship.y, '#ff9b9b', 6, 1.6, [8,14]);
    energy = clamp(energy - 1, 0, MAX_ENERGY);
    updateHUD();
  }

  // HUD update
  function updateHUD(){
    scoreUI.textContent = 'SCORE: ' + score;
    starsUI.textContent = 'STARS: ' + stars;
    energyText.textContent = `${energy} / ${MAX_ENERGY}`;
    const pct = (energy / MAX_ENERGY) * 100;
    energyFill.style.width = pct + '%';
    // highlight highscore updating
    if(score > highScore){
      highScore = score;
      localStorage.setItem('collisionCourseHighScore', highScore);
      highUI.textContent = 'HIGH: ' + highScore;
    }
  }

  // draw functions
  function drawBackground(){
    // base
    ctx.fillStyle = '#050506';
    ctx.fillRect(0,0,W,H);

    // moving starfield (left)
    for(let i=0;i<starsBG.length;i++){
      const s = starsBG[i];
      s.x -= s.speed;
      if(s.x < -8){
        s.x = W + rand(2,30);
        s.y = Math.random()*H;
        s.size = Math.random()*2 + 0.4;
        s.speed = 0.2 + Math.random()*1.6;
        s.alpha = 0.12 + Math.random()*0.6;
      }
      ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // draw asteroid
  function drawAst(a){
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.ang);
    ctx.beginPath();
    a.pts.forEach((p,i)=> i? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
    ctx.closePath();
    ctx.fillStyle = '#bfbfbf';
    ctx.fill();

    // inner shading
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    ctx.beginPath();
    a.pts.forEach((p,i)=> i? ctx.lineTo(p.x*0.6,p.y*0.6) : ctx.moveTo(p.x*0.6,p.y*0.6));
    ctx.closePath();
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    ctx.restore();
  }

  // draw orb (glowing)
  function drawOrb(o){
    // pulse
    const p = 0.45 + 0.55*(0.5 + 0.5*Math.sin(o.pulse));
    const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r*3.2);
    g.addColorStop(0, `rgba(255,215,70,${0.95*p})`);
    g.addColorStop(0.25, `rgba(255,160,50,${0.82*p})`);
    g.addColorStop(0.6, `rgba(255,120,36,${0.38*p})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r*2.6, 0, Math.PI*2);
    ctx.fill();

    // core
    ctx.beginPath();
    ctx.fillStyle = 'rgba(255,236,160,1)';
    ctx.arc(o.x, o.y, o.r*0.9, 0, Math.PI*2);
    ctx.fill();
  }

  // draw ship (smaller, detailed)
  function drawShip(){
    const cx = ship.x;
    const cy = ship.y;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    const s = ship.scale;

    // polygon points (stealth, multi-part)
    const nose = {x: 26*s, y:0};
    const rightCock = {x: 6*s, y:-5*s};
    const leftCock = {x: 6*s, y:5*s};
    const rightWing = {x: -18*s, y:-7*s};
    const leftWing = {x: -18*s, y:7*s};
    const tail = {x: -30*s, y:0};

    // body
    ctx.beginPath();
    ctx.moveTo(nose.x, nose.y);
    ctx.lineTo(rightCock.x, rightCock.y);
    ctx.lineTo(rightWing.x, rightWing.y);
    ctx.lineTo(tail.x, tail.y);
    ctx.lineTo(leftWing.x, leftWing.y);
    ctx.lineTo(leftCock.x, leftCock.y);
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    // inner panel
    ctx.beginPath();
    ctx.moveTo(nose.x - 8*s, -1*s);
    ctx.lineTo(2*s, -1.8*s);
    ctx.lineTo(-8*s, -1.2*s);
    ctx.lineTo(-6*s, 1.4*s);
    ctx.lineTo(2*s, 2.2*s);
    ctx.closePath();
    ctx.fillStyle = '#e9e9e9';
    ctx.fill();

    // trim
    ctx.strokeStyle = 'rgba(0,0,0,0.08)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(nose.x - 8*s, -1*s);
    ctx.lineTo(tail.x + 8*s, -1*s);
    ctx.stroke();

    // thruster beam (behind tail) - blue/purple flicker
    const t = Date.now()*0.007;
    const flick = 0.82 + Math.sin(t*3.2)*0.14;
    const beamLen = 96 + Math.sin(t*2.5)*8;
    const beamW = 30 * flick;
    const beamGrad = ctx.createLinearGradient(tail.x - beamLen, 0, tail.x, 0);
    beamGrad.addColorStop(0, 'rgba(110,224,255,0.0)');
    beamGrad.addColorStop(0.25, 'rgba(110,224,255,0.06)');
    beamGrad.addColorStop(0.6, 'rgba(154,107,255,0.28)');
    beamGrad.addColorStop(1, 'rgba(110,224,255,0.98)');

    ctx.beginPath();
    ctx.moveTo(tail.x, -beamW*0.32);
    ctx.bezierCurveTo(tail.x - beamLen*0.25, -beamW*0.85, tail.x - beamLen*0.75, -beamW*0.6, tail.x - beamLen, 0);
    ctx.bezierCurveTo(tail.x - beamLen*0.75, beamW*0.6, tail.x - beamLen*0.25, beamW*0.85, tail.x, beamW*0.32);
    ctx.closePath();
    ctx.fillStyle = beamGrad;
    ctx.shadowBlur = 30 * flick;
    ctx.shadowColor = 'rgba(130,110,255,0.9)';
    ctx.globalCompositeOperation = 'lighter';
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;

    // small exhaust core
    ctx.beginPath();
    ctx.moveTo(tail.x + 2, -3*s);
    ctx.lineTo(tail.x - 10, 0);
    ctx.lineTo(tail.x + 2, 3*s);
    ctx.closePath();
    ctx.fillStyle = 'rgba(220,235,255,0.92)';
    ctx.fill();

    // subtle outer glow on ship
    ctx.beginPath();
    ctx.moveTo(nose.x, nose.y-0.6*s);
    ctx.lineTo(tail.x, 0);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.stroke();

    ctx.restore();
  }

  // draw lasers (red glowing)
  function drawLaser(L){
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(L.x, L.y - 2);
    ctx.lineTo(L.x + L.len, L.y - 2);
    ctx.lineTo(L.x + L.len, L.y + 2);
    ctx.lineTo(L.x, L.y + 2);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,60,60,1)';
    ctx.shadowBlur = 20;
    ctx.shadowColor = 'rgba(255,40,40,0.95)';
    ctx.fill();
    ctx.restore();
    ctx.shadowBlur = 0;
  }

  // draw particles
  function drawParticles(){
    for(let i=0;i<particles.length;i++){
      const p = particles[i];
      const a = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(1.1, a*4.2), 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // main update loop
  function update(dt){
    if(gameState === 'playing'){
      // spawn asteroids
      spawnTimer += dt;
      const astInt = clamp(880 - Math.min(450,score/2), 420, 1400);
      if(spawnTimer > astInt){
        spawnTimer = 0; createAsteroid();
      }
      // spawn orbs
      orbTimer += dt;
      if(orbTimer > 1400){
        orbTimer = 0; createOrb();
      }

      // ship physics (weight)
      const up = keys['ArrowUp'] || keys['w'] || keys['W'];
      const down = keys['ArrowDown'] || keys['s'] || keys['S'];
      if(up) ship.vy -= ship.accel * (dt/16);
      if(down) ship.vy += ship.accel * (dt/16);
      ship.vy *= (1 - ship.drag);
      ship.vy = clamp(ship.vy, -ship.maxSpeed, ship.maxSpeed);
      ship.y += ship.vy * (dt/16);
      ship.y = clamp(ship.y, 20, H-20);

      // update asteroids
      for(let i=asteroids.length-1;i>=0;i--){
        const a = asteroids[i];
        a.x += a.vx * (dt/16);
        a.y += a.vy * (dt/16);
        a.ang += a.rot * (dt/16);
        if(a.x < -120){ asteroids.splice(i,1); score += 10; updateHUD(); }
      }

      // update orbs
      for(let i=orbs.length-1;i>=0;i--){
        const o = orbs[i];
        o.x += o.vx * (dt/16);
        o.pulse += o.pulseSpeed * (dt/16);
        if(o.x < -40) orbs.splice(i,1);
      }

      // update lasers
      for(let i=lasers.length-1;i>=0;i--){
        const L = lasers[i];
        L.x += L.vx * (dt/16);
        if(L.x > W + 40) lasers.splice(i,1);
      }

      // collisions: ship nose vs asteroids
      for(let i=asteroids.length-1;i>=0;i--){
        const a = asteroids[i];
        const nose = {x: ship.x + 20, y: ship.y};
        const dist = Math.hypot(a.x - nose.x, a.y - nose.y);
        if(dist < a.radius + 6){
          // explode
          explosion(nose.x, nose.y);
          // break to avoid multiple triggers
          break;
        }
      }

      // lasers vs asteroids
      for(let i=lasers.length-1;i>=0;i--){
        const L = lasers[i];
        for(let j=asteroids.length-1;j>=0;j--){
          const a = asteroids[j];
          if(L.x + L.len > a.x - a.radius && L.x < a.x + a.radius){
            if(Math.abs(L.y - a.y) < a.radius + 6){
              emit(a.x, a.y, '#ff9b9b', 10, 2.6, [10,26]);
              asteroids.splice(j,1);
              lasers.splice(i,1);
              score += 120;
              updateHUD();
              break;
            }
          }
        }
      }

      // ship collects orbs
      for(let i=orbs.length-1;i>=0;i--){
        const o = orbs[i];
        const dx = o.x - (ship.x + 18);
        const dy = o.y - ship.y;
        if(Math.hypot(dx,dy) < 28){
          emit(o.x, o.y, '#ffd77a', 12, 1.8, [12,26]);
          orbs.splice(i,1);
          stars += 1;
          score += 90;
          energy = clamp(energy + ENERGY_PER_ORB, 0, MAX_ENERGY);
          updateHUD();
        }
      }

      // particles step
      for(let i=particles.length-1;i>=0;i--){
        const p = particles[i];
        p.x += p.vx * (dt/16);
        p.y += p.vy * (dt/16);
        p.vy += 0.03;
        p.life -= (dt/16);
        if(p.life <= 0) particles.splice(i,1);
      }
    } // end playing

    // dying fade
    if(dying){
      fadeT += dt/700; // fade in ~0.7s
      fadeOverlay.style.opacity = clamp(fadeT, 0, 1);
      // small flash effect by drawing a bright overlay (done in render)
      if(fadeT >= 1){
        // show game over after short pause
        setTimeout(()=> {
          dying = false;
          gameState = 'gameOver';
          showGameOver();
        }, 220);
      }
    }
  }

  // render pass
  let shake = 0;
  function render(){
    // camera shake when recently exploded
    if(dying) shake = Math.min(6, shake + 0.6);
    else shake = Math.max(0, shake * 0.92);

    const sx = Math.round((Math.random()*2-1) * shake);
    const sy = Math.round((Math.random()*2-1) * shake);

    ctx.save();
    ctx.translate(sx, sy);

    drawBackground();

    // draw orbs
    for(let i=0;i<orbs.length;i++) drawOrb(orbs[i]);

    // draw asteroids
    for(let i=0;i<asteroids.length;i++) drawAst(asteroids[i]);

    // draw ship
    drawShip();

    // draw lasers
    for(let i=0;i<lasers.length;i++) drawLaser(lasers[i]);

    // draw particles
    drawParticles();

    // subtle darkness overlay for glow pop
    ctx.fillStyle = 'rgba(0,0,0,0.04)';
    ctx.fillRect(0,0,W,H);

    // flash on explosion (small bright flash when fadeT small)
    if(dying && fadeT < 0.25){
      const a = (0.25 - fadeT) * 0.7;
      ctx.fillStyle = `rgba(255,220,180,${a})`;
      ctx.fillRect(0,0,W,H);
    }

    ctx.restore();
  }

  // main loop
  function frame(ts){
    const dt = Math.min(40, ts - last);
    last = ts;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // start/reset functions
  function resetAll(skipBoot=false){
    // reset everything except boot flag
    gameState = 'menu';
    score = 0; stars = 0; energy = 0;
    asteroids = []; orbs = []; particles = []; lasers = [];
    spawnTimer = 0; orbTimer = 0; dying = false; fadeT = 0;
    ship.x = 120; ship.y = H/2; ship.vx=0; ship.vy=0;
    fadeOverlay.style.opacity = 0;
    updateHUD();
    startScreen.style.display = 'flex';
  }

  function startGame(){
    startScreen.style.display = 'none';
    gameState = 'playing';
    // pre-spawn a couple asteroids and orbs for pacing
    for(let i=0;i<2;i++) createAsteroid();
    for(let i=0;i<1;i++) createOrb();
    last = performance.now();
  }

  function showGameOver(){
    goScore.textContent = 'SCORE: ' + score;
    goStars.textContent = 'STARS: ' + stars;
    gameOver.style.display = 'flex';
    // update highscore
    if(score > highScore){
      highScore = score;
      localStorage.setItem('collisionCourseHighScore', highScore);
      highUI.textContent = 'HIGH: ' + highScore;
    }
  }

  function restart(){
    gameOver.style.display = 'none';
    // show start screen without boot
    resetAll(true);
  }

  // input handlers
  window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if((e.code === 'Enter' || e.code === 'Space') && gameState === 'menu'){
      startGame();
      e.preventDefault();
    } else if(e.code === 'Space' && gameState === 'playing'){
      shoot();
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', (e)=>{ keys[e.key] = false; });

  canvas.addEventListener('mousedown', (ev)=>{
    if(gameState === 'playing' && !dying) shoot();
  });

  startBtn.addEventListener('click', ()=> startGame());
  retryBtn.addEventListener('click', ()=> restart());

  // HUD & boot handling
  function updateHUD(){ updateHUD; } // placeholder so linter won't complain (actual updateHUD defined earlier)
  // override updateHUD reference with the function defined earlier (keeps code flow)
  updateHUD = (function(){
    return function(){
      scoreUI.textContent = 'SCORE: ' + score;
      starsUI.textContent = 'STARS: ' + stars;
      energyText.textContent = `${energy} / ${MAX_ENERGY}`;
      const pct = (energy / MAX_ENERGY) * 100;
      energyFill.style.width = pct + '%';
      if(score > highScore){
        highScore = score;
        localStorage.setItem('collisionCourseHighScore', highScore);
        highUI.textContent = 'HIGH: ' + highScore;
      }
    };
  })();
  updateHUD();

  // pre-populate
  for(let i=0;i<3;i++) createAsteroid();
  for(let i=0;i<1;i++) createOrb();

  last = performance.now();
  requestAnimationFrame(frame);

  // ensure grain updates on resize
  window.addEventListener('resize', ()=> {
    // optional: regenerate grain for new size - small performance hit
    drawGrain();
  });

})();
</script>
</body>
