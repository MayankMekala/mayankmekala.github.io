    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            --bg-nox: #000000;
            --text-nox: #ffffff;
            --border-nox: rgba(255,.5,.5, 0.15);
            --panel-bg-nox: rgba(10, 10, 10, 0.5);
            --accent-nox: #ffffff;
            --glow-nox: 0 0.px rgba(255,.5,.5, 0.25);

            --bg-lux: #f0f0f0;
            --text-lux: #000000; /* This is already set to black for Lux mode */
            --border-lux: rgba(0, 0, 0, 0.15);
            --panel-bg-lux: rgba(255,.5,.5, 0.5);
            --accent-lux: #000000; /* This is already set to black for Lux mode */
            --glow-lux: 0 0.px rgba(0, 0, 0, 0.25);

            --bg-color: var(--bg-nox);
            --text-color: var(--text-nox);
            --border-color: var(--border-nox);
            --panel-bg-color: var(--panel-bg-nox);
            --accent: var(--accent-nox);
            --glow: var(--glow-nox);
            
            --accent-green: #00cc66;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            transition: background-color 0.8s ease, color 0.8s ease;
            line-height: 1.6;
            background-image:
                radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size:.px.px;
        }

        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-nox);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.75s ease, visibility 0.75s ease;
        }

        .loader-logo {
            width: 150px;
            animation: pulse. infinite ease-in-out;
        }

        #loader-wrapper.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        body.loading {
            overflow: hidden;
        }

        .topbar {
            position: fixed;
            top:.px; left:.px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-arrow, .social-icon {
            color: var(--text-color);
            font-size:.px;
            text-decoration: none;
            padding: 5px;
            transition: color 0.3s, transform 0.3s;
            backdrop-filter: blur(5px);
        }

        .back-arrow:hover, .social-icon:hover {
            color: var(--accent-green);
            transform: scale(1.1) translateY(-2px);
        }

        .mode-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius:.px;
            border: 1px solid var(--border-color);
            background: var(--panel-bg-color);
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            font-family: 'Chakra Petch', monospace;
            font-size: 0.9rem;
            color: var(--text-color); /* Ensure text color uses variable */
        }

        .mode-toggle:hover {
            transform: scale(1.05);
            box-shadow: var(--glow);
        }

        #logoMini {
            height:.px; width:.px;
            object-fit: contain;
        }
        
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding:.px;
            position: relative;
        }

        .hero-logo {
            width: clamp(200px, 40vw, 350px);
            max-width: 90%;
            height: auto;
            margin-bottom:.em;
            filter: drop-shadow(var(--glow));
            animation: float 6s ease-in-out infinite;
        }

        .hero-tagline {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1rem, 3.5vw, 1.8rem);
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 1rem;
            color: var(--accent);
        }

        .hero-description {
            font-family: 'Chakra Petch', monospace;
            font-size: clamp(0.8rem, 1.5vw, 1rem);
            max-width: 600px;
            opacity: 0.8;
            line-height: 1.8;
            font-style: italic;
            color: var(--text-color); /* Ensure text color uses variable */
        }
        
        .scroll-indicator {
            position: absolute;
            bottom: 40px; left: 50%;
            transform: translateX(-50%);
            font-family: 'Chakra Petch', monospace;
            font-size: 0.8rem;
            opacity: 0.7;
            animation: bounce. ease-in-out infinite;
            color: var(--text-color); /* Ensure text color uses variable */
        }
        
        .card-deck-section {
            padding: 5vh.px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            gap: 30px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .card-deck-container {
            width: clamp(400px, 50vw, 700px);
            height: 70vh;
            position: relative;
            perspective: 1000px;
            flex-shrink: 0;
        }
        
        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            cursor: pointer;
            user-select: none;
            will-change: transform;
            backface-visibility: hidden;
            background: transparent;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card.sliding-out {
            transition: transform 0.6s cubic-bezier(0.6, -0.28, 0.735, 0.045);
        }
        
        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            pointer-events: none;
            border:.x solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background-color: var(--bg-color);
        }

        .card-info-panel {
            flex: 0 0 320px;
            padding:.px;
            background: var(--panel-bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            max-height: 450px;
            display: flex;
            flex-direction: column;
        }

        .image-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--accent);
        }

        .image-category {
            font-family: 'Chakra Petch', monospace;
            font-size: 0.8rem;
            margin-bottom: 1rem;
            opacity: 0.9;
            font-weight: bold;
            text-transform: uppercase;
            color: var(--accent-green);
        }

        .image-description {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem;
            line-height: 1.5;
            opacity: 0.9;
            flex-grow: 1;
            overflow-y: auto;
            color: var(--text-color); /* Ensure text color uses variable */
        }
        
        .card-controls {
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        
        .card-controls span {
            font-family: 'Chakra Petch', monospace;
            font-size: 0.8rem;
            opacity: 0.8;
            color: var(--text-color); /* Ensure text color uses variable */
        }

        .control-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-family: 'Chakra Petch', monospace;
            font-size: 0.8rem;
            padding: 8px 12px;
            border-radius:.px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .control-btn:hover:not(:disabled) {
            background: var(--accent);
            color: var(--bg-color);
            transform: translateY(-2px);
        }
        .control-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .archive-container {
            padding: 100px.px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .archive-title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.2rem, 4vw,.em);
            font-weight: 700;
            text-align: center;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
        }

        .archive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap:.px;
        }

        .grid-item {
            border: 1px solid var(--border-color);
            background: var(--panel-bg-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            padding: 10px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
        }
        .grid-item:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3), var(--glow);
            z-index:.;
        }
        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .grid-item img.loaded {
            opacity: 1;
        }

        .footer {
            padding: 60px.px;
            text-align: center;
            border-top: 1px solid var(--border-color);
        }
        .footer-logo {
            width: 100px;
            height: 100px;
            margin-bottom: 1rem;
            object-fit: contain;
        }
        .footer-text {
            font-family: 'Chakra Petch', monospace;
            font-size: 0.9rem;
            opacity: 0.7;
            color: var(--text-color); /* Ensure text color uses variable */
        }

        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
        @keyframes bounce { 0%,.%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); } 40% { transform: translateX(-50%) translateY(-10px); } 60% { transform: translateX(-50%) translateY(-5px); } }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.7; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.7; } }

        @media (max-width: 1024px) {
            .card-deck-section { flex-direction: column; gap:.px; }
            .card-deck-container { width: 85vw; height: 60vh; }
            .card-info-panel { flex: none; width: 85vw; max-height: none; }
        }
    </style>
</head>

                'IMG_4010.jpg': { title: 'Mango Laasi in a carton' },
                'IMG_3998.jpg': { title: 'Tropic Evenings' },
                'IMG_4016.jpg': { title: 'Better Call Saul in Sapporo' },
                'IMG_4034.jpg': { title: 'Gas station Chinese takeout' },
                'IMG_4048.jpg': { title: 'Golden Scoprion (Tantanmen Kinkatsu)' },
                'abstract8.jpg': { title: 'Memory Data' },
                'IMG_4923.jpg': { title: 'Bali Pastoria' },
                'IMG_3979.jpg': { title: 'Park' },
                'IMG_4065.jpg': { title: 'Moon Gate' },
                'IMG_4077.jpg': { title: 'Free Wi-Fi in Shinjuku by Godzilla' },
                'abstract11.jpg': { title: 'Mauvian Faces' },
                'IMG_4228.jpg': { title: 'Toho Cinemas' },
                'IMG_4231.jpg': { title: 'Omurice' },
                'IMG_4270.jpg': { title: 'Salesforce Park' },
                'IMG_4079.jpg': { title: 'Tokyo Memorabilia' },
                'IMG_3958.jpg': { title: 'Sapporo City' },
                'IMG_5153.jpg': { title: 'Three Pigs' },
                'IMG_3980.jpg': { title: 'Sapporo Corner' },
                'IMG_3985.jpg': { title: 'Garden' },
                'IMG_4046.jpg': { title: 'Yakisoba' },
                'IMG_4058.jpg': { title: 'How do you cook these things?' },
                'abstract5.jpg': { title: 'Spectrals in the dark' },
                'IMG_3993.jpg': { title: 'November' },
                'IMG_4020.jpg': { title: 'Subrural' },
                'IMG_4021.jpg': { title: 'Kyoto Afternoons' },
                'IMG_4022.jpg': { title: 'Kei Torra' },
                'IMG_4028.jpg': { title: 'Record Store in Japan' },
                'IMG_4024.jpg': { title: 'Kyoto Evening' },
                'IMG_4056.jpg': { title: 'Red Prayer Plant' },
                'IMG_4043.jpg': { title: 'Egghead Sando Café' },
                'IMG_4033.jpg': { title: 'UC Davis Domes' },
            };
            
            const imageFiles = Object.keys(imageData);

            const VISIBLE_CARDS = 7;
            let currentIndex = 0;
            let cardHistory = [];
            let isAnimating = false;

            const modeBtn = document.getElementById('modeBtn');
            const logoMini = document.getElementById('logoMini');
            const footerLogo = document.getElementById('footerLogo');
            const heroLogo = document.getElementById('heroLogo');
            const archiveGrid = document.getElementById('archiveGrid');
            const cardDeck = document.getElementById('cardDeck');
            const imageTitle = document.getElementById('imageTitle');
            const imageCategory = document.getElementById('imageCategory');
            const imageDescription = document.getElementById('imageDescription');
            const backButton = document.getElementById('backButton');
            const resetButton = document.getElementById('resetButton');
            
            const safePath = (folder, filename) => `${folder}/${encodeURIComponent(filename)}`;

            function setMode(mode) {
                const root = document.documentElement;
                const isLux = mode === 'lux';
                
                // Update CSS variables for Lux/Nox mode
                root.style.setProperty('--bg-color', `var(--bg-${mode})`);
                root.style.setProperty('--text-color', `var(--text-${mode})`);
                root.style.setProperty('--border-color', `var(--border-${mode})`);
                root.style.setProperty('--panel-bg-color', `var(--panel-bg-${mode})`);
                root.style.setProperty('--accent', `var(--accent-${mode})`);
                root.style.setProperty('--glow', `var(--glow-${mode})`);
                
                // Update logo images
                const logoSrc = isLux ? 'homeluxlogo/sub1black.png' : 'homeluxlogo/sub1white.png';
                [logoMini, footerLogo, heroLogo].forEach(logo => logo.src = logoSrc);
                modeBtn.querySelector('span').textContent = isLux ? 'LUX' : 'NOX';
                localStorage.setItem('mkx-mode', mode);
            }

            function createCardElement(index) {
                const file = imageFiles[index];
                if (!file) return null;
                const card = document.createElement('div');
                card.className = 'card';
                const img = document.createElement('img');
                img.src = safePath('mkx9000images', file);
                const data = imageData[file] || {};
                img.alt = data.title || 'MKX9000 Image';
                img.loading = 'lazy';
                card.append(img);
                card.addEventListener('click', handleCardNext);
                return card;
            }
            
            function reStackCards() {
                const allCards = cardDeck.querySelectorAll('.card');
                allCards.forEach((card, index) => {
                    card.style.zIndex = index + 1;
                    card.style.transform = `translateY(${(allCards.length - 1 - index) * -4}px) rotate(${(Math.random() - 0.5) * 4}deg)`;
                });
            }

            function updateInfoPanel() {
                if (currentIndex >= imageFiles.length) {
                    imageTitle.textContent = 'Deck Empty';
                    imageCategory.textContent = '';
                    imageDescription.textContent = 'All cards have been viewed. Press RESET to start over.';
                    backButton.disabled = cardHistory.length === 0;
                    return;
                }

                const currentFilename = imageFiles[currentIndex];
                const data = imageData[currentFilename] || {};

                imageTitle.textContent = data.title || currentFilename.replace(/\.[^/.]+$/, '');
                
                if (data.category) {
                    imageCategory.textContent = data.category;
                    imageCategory.style.display = 'block';
                } else {
                    imageCategory.style.display = 'none';
                }
                
                imageDescription.textContent = data.description || 'An experimental digital composition from the MKX9000 archive.';
                backButton.disabled = cardHistory.length === 0;
            }

            function handleCardNext(event) {
                if (isAnimating || currentIndex >= imageFiles.length) return;
                isAnimating = true;
                
                const activeCard = event.currentTarget;

                cardHistory.push(currentIndex);
                currentIndex++;
                updateInfoPanel();

                const nextCardIndex = currentIndex + VISIBLE_CARDS - 1;
                if (nextCardIndex < imageFiles.length) {
                    const newCard = createCardElement(nextCardIndex);
                    if (newCard) cardDeck.prepend(newCard);
                }
                
                const remainingCards = cardDeck.querySelectorAll('.card');
                remainingCards.forEach((card, index) => {
                    if (card !== activeCard) {
                        card.style.zIndex = index + 1;
                        card.style.transform = `translateY(${(remainingCards.length -.- index) * -4}px) rotate(${(Math.random() - 0.5) * 4}deg)`;
                    }
                });

                activeCard.classList.add('sliding-out');
                activeCard.style.zIndex = 1000;
                
                setTimeout(() => {
                    activeCard.style.transform = `translateX(-120%) rotate(-15deg)`;
                }, 0);

                setTimeout(() => {
                    activeCard.remove();
                    isAnimating = false;
                }, 600);
            }

            function handleCardBack() {
                if (isAnimating || cardHistory.length === 0) return;
                isAnimating = true;

                currentIndex = cardHistory.pop();

                if (cardDeck.children.length >= VISIBLE_CARDS) {
                    cardDeck.firstElementChild.remove();
                }
                
                const cardToRestore = createCardElement(currentIndex);
                cardToRestore.style.transform = `translateX(-120%) rotate(-15deg)`;
                cardToRestore.style.zIndex = 1000;
                cardDeck.append(cardToRestore);
                
                setTimeout(() => {
                    reStackCards();
                    updateInfoPanel();
                    isAnimating = false;
                }, 50);
            }

            function initializeDeck() {
                isAnimating = false;
                cardDeck.innerHTML = '';
                cardHistory = [];
                currentIndex = 0;
                
                const cardsToCreate = Math.min(imageFiles.length, VISIBLE_CARDS);
                for (let i = cardsToCreate - 1; i >= 0; i--) {
                    const card = createCardElement(i);
                    if (card) {
                        if (i === 0) card.querySelector('img').loading = 'eager';
                        cardDeck.append(card);
                    }
                }
                reStackCards();
                updateInfoPanel();
            }

            function populateArchiveGrid() {
                const observer = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const img = entry.target.querySelector('img');
                            img.src = img.dataset.src;
                            img.onload = () => img.classList.add('loaded');
                            observer.unobserve(entry.target);
                        }
                    });
                }, { rootMargin: "0px 0px.0px 0px" });
                
                imageFiles.forEach(file => {
                    const gridItem = document.createElement('div');
                    gridItem.className = 'grid-item';
                    gridItem.dataset.filename = file; 
                    const img = document.createElement('img');
                    img.dataset.src = safePath('mkx9000images', file);
                    const data = imageData[file] || {};
                    img.alt = data.title || 'MKX9000 Archive Image';
                    gridItem.append(img);
                    archiveGrid.append(gridItem);
                    observer.observe(gridItem);
                });
            }

            function handleArchiveClick(event) {
                const gridItem = event.target.closest('.grid-item');
                if (!gridItem || isAnimating) return;

                const filename = gridItem.dataset.filename;
                const targetIndex = imageFiles.indexOf(filename);

                if (targetIndex === -1 || targetIndex === currentIndex) return;
                
                isAnimating = true;
                currentIndex = targetIndex;
                cardHistory = Array.from({ length: targetIndex }, (_, i) => i);

                cardDeck.innerHTML = '';
                const start = currentIndex;
                const end = Math.min(start + VISIBLE_CARDS, imageFiles.length);
                
                for (let i = end - 1; i >= start; i--) {
                    const card = createCardElement(i);
                    if (card) cardDeck.append(card);
                }

                reStackCards();
                updateInfoPanel();
                
                document.querySelector('.card-deck-section').scrollIntoView({ behavior: 'smooth', block: 'center' });
                
                setTimeout(() => { isAnimating = false; }, 500);
            }

            modeBtn.addEventListener('click', () => {
                const currentMode = localStorage.getItem('mkx-mode') || 'nox';
                setMode(currentMode === 'lux' ? 'nox' : 'lux');
            });

            backButton.addEventListener('click', handleCardBack);
            resetButton.addEventListener('click', initializeDeck);
            archiveGrid.addEventListener('click', handleArchiveClick);

            window.addEventListener('keydown', (e) => {
                if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
                if (e.key.toLowerCase() === 'l') modeBtn.click();
                else if (e.key.toLowerCase() === 'r') resetButton.click();
                else if (e.key === 'ArrowLeft') backButton.click();
                else if (e.key === 'ArrowRight' && cardDeck.lastElementChild) {
                    cardDeck.lastElementChild.click();
                }
            });

            setMode(localStorage.getItem('mkx-mode') || 'nox');
            populateArchiveGrid();
            initializeDeck();
        });
    </script>
</body>
